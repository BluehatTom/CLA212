*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.58 Arial,Helvetica,sans-serif}h1,h2,h3,h4,p{margin-top:0}h1,h2{font-family:Georgia,'Times New Roman',serif;line-height:1.18;letter-spacing:-.025em}h1{font-size:clamp(2rem,3.65vw,3.05rem);margin-bottom:14px}h2{font-size:clamp(1.48rem,2.8vw,2.15rem);margin-bottom:14px}h3{font-size:1.12rem;margin-bottom:8px;line-height:1.3}p{margin-bottom:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.58}input,textarea,select{width:100%;min-height:45px;border:1px solid #8C8F90;background:#fff;color:#202124;border-radius:8px;padding:10px 12px}textarea{min-height:110px;resize:vertical}input[type="checkbox"],input[type="radio"]{width:19px;height:19px;min-height:19px;flex:none;accent-color:var(--red);margin:3px 4px 0 0}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,[tabindex="-1"]:focus-visible{outline:3px solid var(--slate);outline-offset:3px}a{color:var(--red-dark);text-underline-offset:3px}a:hover{text-decoration-thickness:2px}[hidden]{display:none!important}.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}.skip-link{position:absolute;top:-100px;left:18px;z-index:999;background:#fff;color:#141414;border:3px solid #141414;padding:9px 16px}.skip-link:focus{top:12px}h1[tabindex="-1"]:focus{outline:none}.masthead{background:var(--red);color:white}.masthead-inner{max-width:1250px;padding:17px 26px;margin:auto;display:flex;gap:15px;align-items:center;justify-content:space-between}.app-name{font:700 1.37rem/1.2 Georgia,'Times New Roman',serif;letter-spacing:-.01em}.app-meta{font-size:.85rem;font-weight:700;opacity:.96}.shell{max-width:1250px;margin:0 auto;padding:26px}.panel{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:15px;min-width:0}.hero{border-top:6px solid var(--red);padding:clamp(24px,4vw,44px)}.eyebrow{color:var(--red-dark);font-size:.78rem;letter-spacing:.11em;font-weight:800;text-transform:uppercase;margin:0 0 12px}.lede{font-size:1.12rem;color:#3d4247;max-width:780px}.muted,.small{color:var(--muted)}.small{font-size:.87rem}.micro{font-size:.76rem;color:var(--muted)}.grid{display:grid;gap:18px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px 17px;min-height:46px;border-radius:9px;border:2px solid transparent;font-weight:700;line-height:1.3;background:white;color:var(--ink)}.btn:hover:not(:disabled){filter:brightness(.96)}.btn.primary{background:var(--red);color:white;border-color:var(--red)}.btn.primary:hover:not(:disabled){background:var(--red-dark);border-color:var(--red-dark)}.btn.outline{color:var(--slate);border-color:var(--slate)}.btn.quiet{border-color:var(--line);background:white}.btn.danger{color:var(--red-dark);border-color:#C98A96}.btn.sm{min-height:43px;font-size:.86rem;padding:8px 12px}.btn.block{width:100%}.chip{display:inline-flex;gap:5px;align-items:center;border-radius:999px;background:var(--pale);padding:4px 11px;font-weight:700;font-size:.75rem;color:#30343A}.chip.red{background:var(--red);color:#fff}.chip.green{background:var(--green-pale);color:var(--green)}.chip.blue{background:var(--blue-pale);color:var(--slate)}.case-card{padding:24px;border-top:5px solid var(--slate)}.case-card h2{font-size:1.55rem}.case-card .btn{margin-top:10px}.case-card p{min-height:70px}.case-card[aria-current="true"]{border-color:var(--red);border-top-color:var(--red)}.feature-list{padding:0;margin:14px 0;list-style:none}.feature-list li{padding:8px 0 8px 27px;position:relative}.feature-list li:before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:900}.stage-shell{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:18px;align-items:start}.stage-panel{padding:clamp(19px,3vw,33px)}.coach{padding:22px;position:sticky;top:18px}.coach h2{font-size:1.34rem}.coach ul{padding-left:18px}.coach li{margin:10px 0}.case-strip{background:var(--blue-pale);border:1px solid #D4E0EA;border-radius:11px;padding:17px 18px;margin:19px 0}.case-strip p:last-child{margin:0}.tabs-wrap{background:#fff;padding:18px 20px;margin-top:20px}.tabs-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:13px}.tabs-top strong{font-size:.91rem}.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.tab{display:flex;flex-direction:column;gap:4px;justify-content:center;min-height:70px;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--cream);color:#34383C;padding:9px 11px}.tab .number{font-size:.73rem;font-weight:800;letter-spacing:.03em}.tab .name{font-size:.88rem;line-height:1.32;font-weight:800}.tab[aria-current="step"]{border:2px solid var(--red);background:#FFF7F8;color:var(--red-dark)}.tab.complete .number:after{content:" · Complete";color:var(--green)}.progressbar{height:6px;margin-top:14px;border-radius:7px;background:var(--pale);overflow:hidden}.progressbar>span{display:block;height:100%;background:var(--red);transition:width .15s}.stage-strap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}.stage-title p{max-width:800px;color:#46494c}.section{border-top:1px solid var(--line);padding-top:25px;margin-top:29px}.section.first{border-top:0;margin-top:0;padding-top:0}.section-heading{display:flex;gap:10px;align-items:center;margin-bottom:12px}.step-number{background:var(--red);color:#fff;border-radius:50%;height:29px;width:29px;display:inline-grid;place-items:center;font-weight:800;font-size:.83rem;flex:none}.section-heading h2{font:700 1.3rem/1.3 Arial,Helvetica,sans-serif;letter-spacing:0;margin:0}.subtle{padding:15px 18px;border-radius:10px;background:var(--cream);border:1px solid var(--line);margin:14px 0}.subtle strong{display:block;margin-bottom:5px}.notice{background:#fff8eb;border-left:5px solid #9F681E;padding:14px 16px;border-radius:6px;margin:15px 0}.success{background:var(--green-pale);border-left:5px solid var(--green);padding:14px 16px;border-radius:6px;margin:15px 0}.feedback{background:var(--blue-pale);border-left:5px solid var(--slate);padding:16px;border-radius:7px;margin:16px 0}.feedback h3{margin-bottom:7px}.feedback p:last-child{margin-bottom:0}.label{font-weight:700;display:block;margin-bottom:6px}.hint{font-size:.82rem;color:var(--muted);margin:4px 0 10px}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field small{display:block;color:var(--muted);font-size:.8rem;margin:4px 0 0}.evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.evidence-card{border:1px solid var(--line);border-radius:10px;padding:17px;background:#fff;min-width:0}.evidence-card .meta{display:flex;align-items:center;gap:7px;justify-content:space-between;flex-wrap:wrap;margin-bottom:11px}.source{color:#354b5c;background:var(--blue-pale);padding:3px 8px;font-size:.73rem;border-radius:5px;font-weight:700}.evidence-card p{font-size:.98rem;margin:0 0 12px}.segmented{display:flex;flex-wrap:wrap;gap:5px}.segmented .choice{background:white;border:1px solid #949897;border-radius:8px;padding:8px 9px;font-size:.78rem;font-weight:700;min-height:43px;color:#34383d}.segmented .choice[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:white}.evidence-response{border-top:1px solid var(--line);padding-top:10px;margin-top:11px;font-size:.84rem}.evidence-response.ok{color:var(--green)}.evidence-response.caution{color:var(--red-dark)}.option-list{display:grid;gap:12px;margin:15px 0}.option{display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);padding:17px;border-radius:10px;background:white}.option:has(input:checked){border:2px solid var(--slate);background:var(--blue-pale);padding:16px}.option strong{display:block;margin-bottom:5px}.option .small{display:block}.flag{display:flex;gap:10px;align-items:flex-start;min-height:42px;margin:8px 0}.flag input{margin-top:4px}.help-list{margin:7px 0 8px;padding-left:20px}.help-list li{margin:6px 0}.write-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.insight-preview{padding:17px 19px;background:#fff7f8;border:1px solid #E7C4CB;border-left:5px solid var(--red);border-radius:9px;margin-top:15px}.insight-preview p{margin-bottom:5px}.module-actions{border-top:1px solid var(--line);padding-top:24px;margin-top:30px;display:flex;align-items:center;gap:11px;justify-content:space-between;flex-wrap:wrap}.idea-card{border:1px solid var(--line);padding:16px;border-radius:10px;background:#fff}.idea-card .row{justify-content:space-between}.idea-text{white-space:pre-wrap;margin:9px 0}.tag{font-size:.76rem;font-weight:800;color:var(--slate)}.technique{border:1px solid var(--line);background:#fff;padding:14px;min-height:76px;border-radius:10px;text-align:left;width:100%;color:var(--ink)}.technique[aria-pressed="true"]{border:2px solid var(--red);background:#fff7f8;color:var(--red-dark)}.technique strong,.technique small{display:block}.technique small{color:#575a5d;font-weight:400;margin-top:5px}.constraint{border:1px solid #D6C293;background:#FFF9E9;border-radius:9px;padding:16px;margin:15px 0}.rating-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.rating-grid label{font-weight:700;font-size:.86rem;display:block}.rating-grid select{margin-top:5px}.score{font:800 1.18rem Arial,sans-serif;color:var(--slate);white-space:nowrap}.ranked{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--cream);border-radius:9px;padding:13px 15px;margin:9px 0}.proto-step{border:1px solid var(--line);border-radius:10px;padding:18px;margin:13px 0;background:white}.proto-step .count{background:var(--pale);border-radius:7px;padding:5px 10px;font-weight:800;color:#414141}.proto-step .fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:8px}.proto-step .field{margin:6px 0}.proto-preview{border-left:4px solid var(--red);background:#fff7f8;padding:18px;border-radius:8px;margin:13px 0}.proto-preview .small{white-space:pre-wrap}.testing-metric{border:1px solid var(--line);border-radius:9px;background:var(--cream);padding:16px}.testing-metric strong{font-size:1.25rem;display:block}.mode-note{border:1px solid var(--line);border-left:5px solid var(--slate);background:#f7f9fa;border-radius:8px;padding:15px;margin:13px 0}details{margin:17px 0}summary{cursor:pointer;font-weight:700;padding:10px 4px}details .details-content{padding:8px 16px 19px;border:1px solid var(--line);background:var(--cream);border-radius:9px}.footer{max-width:1250px;margin:0 auto;padding:2px 26px 36px;color:var(--muted);font-size:.83rem}.footer .divider{border-top:1px solid var(--line);padding-top:17px;margin-top:25px}.count{font-variant-numeric:tabular-nums}.feedback:focus,.notice:focus{outline:3px solid var(--slate)}

</style></head><body><a class="skip-link" href="#main">Skip to main content</a><header class="masthead"><div class="masthead-inner"><div class="app-name">Design Thinking Learning Lab</div><div class="app-meta">Lab 1 of 6 · Interview Simulator</div></div></header><div id="live-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div><div id="app" class="shell"></div><footer class="footer"><div class="divider">Fictional teaching cases. Download interview notes to use in the next lab. No student login, server, or timed tasks are required.</div></footer><script>
(()=>{'use strict';
const CASES={"campus": {"title": "Campus events", "persona": "Jordan", "descriptor": "A commuter student deciding whether to attend campus events", "context": "Jordan is a 19-year-old commuter student who travels about 35 minutes each way. Campus activities can compete with class schedules, work, and the trip home.", "opening": "Thanks for talking with me. I’m trying to understand what students experience when they consider campus events. There are no right answers. Could you share what it’s been like for you?", "greeting": "Sure. I have seen events I thought might be interesting, but I usually leave campus after class.", "nodes": {"start": {"options": [["Tell me about the last time you considered attending a campus event.", "past", "behavioral"], ["Why don’t commuter students participate in campus events?", "why", "judgmental"], ["Would more social-media advertising make you attend?", "posters", "leading"]]}, "why": {"response": "I’m not sure about everyone else. I guess we’re all busy.", "coach": "A “why don’t you” framing invites generalizations and defensiveness. Recover with an actual recent experience.", "options": [["What is your routine after your last class?", "routine", "behavioral"], ["Can you recall one event you considered but skipped?", "past", "behavioral"]]}, "posters": {"response": "Maybe. I already see some posts about events, though.", "coach": "Agreeing with a proposed fix is not evidence that awareness is the problem. Ask what happened after seeing a post.", "options": [["What happened the last time you saw an event announcement?", "past", "behavioral"], ["Where did you notice the event information?", "messages", "behavioral"]]}, "past": {"response": "There was a career event last month. I saw it on Instagram and thought it sounded useful. It started at six, but my last class ended around two-thirty.", "evidence": "Jordan knew about a career event but the gap between class and its start time affected attendance.", "coach": "A specific past event is more useful than a prediction. Explore the sequence and the decision.", "options": [["Walk me through what happened after your class that day.", "routine", "behavioral"], ["Where did you look for the location and schedule?", "messages", "behavioral"], ["If it started at three, would you definitely have gone?", "hypothetical", "hypothetical"]]}, "routine": {"response": "I usually go straight to my car. It takes me about thirty-five minutes to get home, and once I leave I almost never come back that evening.", "evidence": "Jordan typically leaves after class and a 35-minute commute makes returning unlikely.", "coach": "This reveals a practical constraint, not necessarily a lack of interest. Look for exceptions.", "options": [["Can you remember a time you did stay for something?", "exception", "behavioral"], ["What made you decide to leave on the career-event day?", "gap", "behavioral"], ["Would free food convince you to stay?", "free_food", "leading"]]}, "gap": {"response": "It felt like a lot of time to kill, and I had homework and a shift the next morning. I was not going to sit around for hours.", "evidence": "Long unstructured gaps, study obligations, and other commitments influence Jordan’s decisions.", "coach": "The issue might be time use and predictability rather than event promotion.", "options": [["What would make a gap between class and an event feel useful?", "productive", "open"], ["Which days tend to work better for you?", "schedule", "behavioral"]]}, "hypothetical": {"response": "Maybe. Three sounds better, but I really don’t know what I would do.", "coach": "Hypothetical commitment is weak evidence. Ask about an event Jordan actually attended.", "options": [["Tell me about a time you stayed after class for an activity.", "exception", "behavioral"], ["What kinds of gaps have you actually waited through?", "threshold", "behavioral"]]}, "free_food": {"response": "I like free food, but it probably would not make me wait three hours.", "evidence": "A food incentive alone is unlikely to overcome a long scheduling gap for Jordan.", "coach": "Jordan challenged a solution-first assumption. Explore the actual conditions of participation.", "options": [["What was different on a day you did stay?", "exception", "behavioral"], ["What would make staying feel worthwhile?", "productive", "open"]]}, "exception": {"response": "I stayed once for a club workshop because it started about twenty minutes after class. A friend told me what it would be like and met me there.", "evidence": "Jordan has attended when timing was convenient and a friend helped explain the experience.", "coach": "Exceptions are powerful: they complicate “students are uninterested” and point toward testable conditions.", "options": [["Which mattered more that day: the timing or your friend?", "priority", "comparison"], ["What did your friend tell you that helped?", "belonging", "open"], ["How did you find the event information?", "messages", "behavioral"]]}, "priority": {"response": "Timing first. If it was three hours later, even having a friend there might not have helped.", "evidence": "Jordan describes event timing as more important than companionship when the gap is very long.", "coach": "A comparison helps weigh factors without declaring one universal cause.", "options": [["How long a gap have you actually stayed through?", "threshold", "behavioral"], ["What else made that workshop feel approachable?", "belonging", "open"]]}, "belonging": {"response": "I knew where to go and what people would do. I would not have been comfortable showing up alone without knowing any of that.", "evidence": "Knowing the location, format, and social expectations helped Jordan feel comfortable attending.", "coach": "The need includes confidence and expectations, not just scheduling.", "options": [["Have event descriptions ever been confusing or inconsistent?", "messages", "behavioral"], ["What did you look for when you arrived?", "arrival", "behavioral"]]}, "messages": {"response": "For one event I saw three different announcements, and I could not tell whether the location had changed. The posts did not all say the same thing.", "evidence": "Conflicting announcements made Jordan uncertain which event location was accurate.", "coach": "This supports an information-reliability need; it does not automatically justify creating another app.", "options": [["What did you do when you noticed the different locations?", "checking", "behavioral"], ["What information would you need before deciding to stay?", "needed_info", "open"]]}, "checking": {"response": "I checked one more account and then gave up. It was not worth finding out if I was looking at an old post.", "evidence": "Jordan abandoned a search after finding conflicting event information.", "coach": "A concrete workaround or abandonment reveals where confidence was lost.", "options": [["When have the details been clear enough for you?", "exception", "comparison"], ["What information should be reliable first?", "needed_info", "open"]]}, "needed_info": {"response": "The time, location, how long it lasts, and what I would actually be doing. Otherwise I cannot tell whether it fits my day.", "evidence": "Jordan wants reliable time, location, duration, and activity expectations before committing.", "coach": "This is a stakeholder need that can support many different solution concepts.", "options": [["What would happen if you arrived alone?", "arrival", "open"], ["Which of those details has caused an actual problem?", "messages", "behavioral"]]}, "arrival": {"response": "If I know where to go and what people will actually do, I’m more likely to consider it. Walking in alone without a plan is awkward.", "evidence": "Jordan reports that clear arrival guidance and activity expectations increase confidence about attending.", "coach": "The interview reveals practical and social dimensions. Keep them distinct when framing the problem.", "options": [["What was arrival like at the workshop you attended?", "belonging", "behavioral"], ["Which days tend to fit better?", "schedule", "behavioral"]]}, "productive": {"response": "If I could study with someone or meet a professor in between, staying might feel productive. Just waiting doesn’t.", "evidence": "A useful activity during a gap may make staying on campus more worthwhile for Jordan.", "coach": "This is a promising condition to investigate, not yet a validated design feature.", "options": [["Which days might such a gap occur?", "schedule", "behavioral"], ["What has happened when you tried staying before?", "exception", "behavioral"]]}, "schedule": {"response": "Tuesday and Thursday are usually better. Some other days I finish really early or have work afterward.", "evidence": "Jordan’s availability varies by day because of class and work timing.", "coach": "Specific scheduling patterns reveal that the problem is not uniform across students or days.", "options": [["How long would you realistically stay after class?", "threshold", "behavioral"], ["What details help you decide in advance?", "needed_info", "open"]]}, "threshold": {"response": "Maybe forty-five minutes to an hour at most. More than that and I start thinking about getting home.", "evidence": "Jordan estimates a practical waiting tolerance of roughly 45–60 minutes, but this needs further observation.", "coach": "Threshold estimates are useful but should be checked against observed behavior rather than treated as precise measurements.", "options": [["Tell me about an event you did attend.", "exception", "behavioral"], ["What happened when the gap was longer?", "gap", "behavioral"]]}}}, "pickup": {"title": "Customer pickup experience", "persona": "Elena", "descriptor": "A first-time online-order pickup customer at Riverbend Home & Garden", "context": "Elena purchased items online for pickup at Riverbend Home & Garden. Your team wants to understand the customer’s experience from arrival through handoff without assuming the problem is speed.", "opening": "Thanks for meeting with me. I’m trying to learn what the online-order pickup experience was like from your perspective, including anything that worked well or felt confusing. Could you walk through it with me?", "greeting": "Sure. Some parts were convenient, but I was not always sure I was in the right place or that the order was complete.", "nodes": {"start": {"options": [["Walk me through what happened when you arrived to pick up your order.", "arrival", "behavioral"], ["Was the pickup experience easy?", "easy", "closed"], ["Would a pickup app make everything better?", "app", "leading"]]}, "easy": {"response": "Some of it was. The order was ready pretty quickly, but I was a little confused.", "coach": "“Was it easy?” invites an overall rating. Ask for the particular moment of uncertainty.", "options": [["Where did you first feel uncertain?", "arrival", "behavioral"], ["What happened after you joined the line?", "wait", "behavioral"]]}, "app": {"response": "I do not really want another app just to pick something up. Maybe if it worked well.", "coach": "This tests a hypothetical fix before understanding the problem. Return to observed customer behavior.", "options": [["What did you do when you arrived?", "arrival", "behavioral"], ["What information did you have on your order email?", "email", "behavioral"]]}, "arrival": {"response": "Parking was easy, but when I walked inside I could not tell whether pickup was at the returns counter or the service desk.", "evidence": "Elena found parking easily but could not identify the correct pickup location on entering.", "coach": "An experience walkthrough shows the precise point where the service journey became uncertain.", "options": [["What did you look at to decide where to go?", "signs", "behavioral"], ["What happened when you reached the counter area?", "lines", "behavioral"], ["Would bigger signs have fixed it?", "bigger", "leading"]]}, "signs": {"response": "The signs for pickup and returns looked similar from the entrance. I had to walk closer to see what they said.", "evidence": "Similar signs near the entrance made pickup and returns difficult to distinguish at a distance.", "coach": "Environmental observations can clarify why a route was hard to follow. Avoid committing to one visual fix yet.", "options": [["What did you do after you got closer?", "lines", "behavioral"], ["When did you first know you were in the right place?", "checking", "behavioral"]]}, "bigger": {"response": "Maybe. I still might have gone to the wrong counter if the labels looked the same.", "coach": "Elena is responding to your design idea. Broaden the question to what she actually noticed.", "options": [["What did you see first at the entrance?", "signs", "behavioral"], ["How did you choose a line?", "lines", "behavioral"]]}, "lines": {"response": "There were two lines, and I was not sure which was for online orders. I watched what other people were doing before I picked one.", "evidence": "Elena could not distinguish the online-order queue and used other customers as clues.", "coach": "The customer’s workaround reveals an uncertainty in the joining process.", "options": [["What happened when you joined that line?", "checkin", "behavioral"], ["What would you have expected to see before lining up?", "expectation", "open"], ["Did you ask anyone for help?", "staff", "behavioral"]]}, "checkin": {"response": "A staff member asked for my name and found the order, but I wasn’t sure whether I was checked in or still waiting for someone else.", "evidence": "Elena was uncertain whether staff acknowledgment meant pickup was in progress.", "coach": "The need may be confirmation of status, not merely a shorter wait.", "options": [["How did you know the order was being found?", "wait", "behavioral"], ["What would have told you that check-in was complete?", "status", "open"]]}, "staff": {"response": "Someone eventually pointed me toward the right line. They were helpful, but I would not have known what to do if nobody was there.", "evidence": "Staff guidance helped Elena recover, but the process depended on someone being available to redirect her.", "coach": "A staff workaround can conceal design friction during normal operations.", "options": [["What might happen when staff are busy?", "rush", "open"], ["What happened next in the line?", "checkin", "behavioral"]]}, "expectation": {"response": "I expected to see something that said “Online pickup—start here,” before I had to choose a line.", "evidence": "Elena expected a clear cue at the point where she must choose a queue.", "coach": "A user’s expectation is useful evidence about information needs, not a mandate for exact wording.", "options": [["What did you actually do next?", "checkin", "behavioral"], ["What information was on your confirmation email?", "email", "behavioral"]]}, "email": {"response": "The email said my order was ready and gave the store address, but it did not explain which counter to use once I got there.", "evidence": "The order-ready email identified the store but not the pickup counter or check-in process.", "coach": "Pre-arrival instructions are part of the customer journey, not just the in-store environment.", "options": [["What did you do when you arrived?", "arrival", "behavioral"], ["What would you have expected the email to tell you?", "expectation", "open"]]}, "wait": {"response": "The order actually came out fast. I was more worried about whether anyone knew I was waiting in the right place.", "evidence": "Elena reported a short actual wait but uncertainty about whether staff had acknowledged her.", "coach": "This is evidence against the convenient but unsupported explanation that staff were too slow.", "options": [["What happened when the bag was handed to you?", "handoff", "behavioral"], ["How could you tell the process was moving forward?", "status", "open"]]}, "status": {"response": "Something that told me “We have your order and are getting it” would have helped. I kept looking back at the counter.", "evidence": "Elena wanted a clear acknowledgment that her order had entered the pickup process.", "coach": "The user described a need for status information; multiple designs might address it.", "options": [["What happened at the handoff?", "handoff", "behavioral"], ["What did you do when you were uncertain?", "checking", "behavioral"]]}, "checking": {"response": "I checked my email again and looked around at other customers. I still did not know which place was right until someone waved me over.", "evidence": "Elena relied on her email, other customers, and staff gestures to recover from unclear direction.", "coach": "Look for where the journey forces customers to guess or ask someone.", "options": [["What happened when staff recognized you?", "checkin", "behavioral"], ["How was your order handed over?", "handoff", "behavioral"]]}, "handoff": {"response": "I got the bag quickly, but I still did not know if I had everything. Nobody said how many items there should be or what to do if something was missing.", "evidence": "Elena received the order promptly but lacked confirmation that all items were included.", "coach": "Task completion and confidence in completion are different outcomes.", "options": [["How did you check whether the order was complete?", "verify", "behavioral"], ["What information would have reassured you?", "missing", "open"], ["Would automated lockers fix the issue?", "lockers", "leading"]]}, "lockers": {"response": "I’m not sure. A locker could still give me the wrong bag.", "coach": "Automating the handoff does not necessarily resolve order verification. Explore the underlying need.", "options": [["What did you do to check the contents?", "verify", "behavioral"], ["What did you expect the employee to confirm?", "missing", "open"]]}, "verify": {"response": "I compared the bag to my receipt in the car. The right products were there, but I would rather know before leaving the store.", "evidence": "Elena verified the order herself after leaving the counter instead of receiving clear handoff confirmation.", "coach": "A workaround after the service is “finished” can reveal a hidden failure in the experience.", "options": [["What if an item had been missing?", "missing", "open"], ["What happened differently in other pickup experiences?", "contrast", "comparison"]]}, "missing": {"response": "I wanted someone to say the order was complete and tell me what to do if an item was missing. I did not know whether I should come back inside.", "evidence": "Elena wanted explicit confirmation of a complete order and a clear recovery process for missing items.", "coach": "This need supports many possible service designs without dictating a particular technology.", "options": [["How was this different from another pickup you have used?", "contrast", "comparison"], ["How might a crowded day change your experience?", "rush", "open"]]}, "contrast": {"response": "At another store they confirmed the number of items and said “You’re all set.” It took no longer, but I felt confident leaving.", "evidence": "A clear final confirmation at a different store made a similar pickup feel complete without slowing it.", "coach": "A useful contrast helps separate actual speed from the experience of certainty.", "options": [["What would you tell someone doing this for the first time?", "first_time", "open"], ["What was unclear in the current handoff?", "handoff", "behavioral"]]}, "rush": {"response": "If it were really busy I might give up or join the wrong line. Today the store was not crowded, so it could have been worse.", "evidence": "Elena predicts rush-hour confusion, but this is a hypothetical risk that would require actual busy-period observation.", "coach": "Distinguish a forecast from an observation; use this as a question for later testing.", "options": [["Which part of today was confusing despite the short line?", "lines", "behavioral"], ["What would you need to know as a first-time customer?", "first_time", "open"]]}, "first_time": {"response": "I would tell them to ask which counter to use, make sure someone has acknowledged the order, and check all the items before leaving.", "evidence": "Elena identifies wayfinding, acknowledgment, and item confirmation as distinct parts of a successful pickup.", "coach": "The interview identifies multiple moments of uncertainty across a service journey.", "options": [["What happened when you first entered the store?", "arrival", "behavioral"], ["What would have helped you verify your order?", "missing", "open"]]}}}};
const $=id=>document.getElementById(id), root=$('app'),status=$('live-status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={campus:'Jordan · Campus events',pickup:'Elena · Customer pickup'};
const key=id=>'dt_interview_v2_'+id;
let state=null;
const fresh=id=>({version:2,caseId:id,current:'start',turns:[],evidence:[],extraNotes:[],draft:'',reflection:'',finished:false});
function load(id){try{const x=JSON.parse(localStorage.getItem(key(id)));if(x&&x.version===2&&x.caseId===id&&Array.isArray(x.turns)&&Array.isArray(x.evidence)&&Array.isArray(x.extraNotes))return x}catch(e){}return fresh(id)}
function save(){if(!state)return;try{localStorage.setItem(key(state.caseId),JSON.stringify(state))}catch(e){say('Your browser blocked local saving. Download your interview notes before leaving.') }}
function say(msg){status.textContent='';setTimeout(()=>{status.textContent=msg},25)}
function download(filename,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function notes(){return [...state.evidence,...state.extraNotes.map((x,i)=>({text:x,source:'My field note'}))]}
function exportData(){const c=CASES[state.caseId];return {format:'DTL_INTERVIEW_V1',version:1,caseId:state.caseId,caseTitle:c.title,persona:c.persona,source:'Design Thinking Learning Lab – Interview Simulator',notes:notes().map((n,i)=>({id:'I'+(i+1),text:n.text,source:n.source||c.persona+' · interview',kind:'evidence'})),turns:state.turns.map(t=>({question:t.question,response:t.response,questionType:t.kind,coachFeedback:t.coach})),reflection:state.reflection,disclaimer:'Simulated conversation for learning, not actual human-subject evidence.'}}
function downloadNotes(){download('Lab_01_Interview_'+state.caseId+'_notes.json',JSON.stringify(exportData(),null,2),'application/json;charset=utf-8');say('Interview notes JSON downloaded. Import it into the Problem Framing lab.')}
function downloadReport(){const c=CASES[state.caseId];const items=state.turns.map((t,i)=>`<li><p><strong>Question ${i+1}:</strong> ${esc(t.question)}</p><p><strong>${esc(c.persona)}:</strong> ${esc(t.response)}</p><p>${esc(t.coach)}</p></li>`).join('');const evidence=notes().map(x=>`<li>${esc(x.text)}</li>`).join('');const body=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview learning artifact · ${esc(c.title)}</title><style>body{max-width:850px;margin:0 auto;padding:30px;color:#202124;font:16px/1.6 Arial,sans-serif}h1,h2{font-family:Georgia,serif}h1{border-bottom:5px solid #C41230;padding-bottom:16px}h2{color:#9A0C26}li{margin:12px 0}p{white-space:pre-wrap}</style></head><body><h1>Interview Simulator · ${esc(c.title)}</h1><p>Persona: ${esc(c.persona)} · ${esc(c.descriptor)}</p><h2>Interview path</h2><ol>${items}</ol><h2>Findings</h2><ol>${evidence}</ol><h2>Reflection</h2><p>${esc(state.reflection)}</p><footer>Fictional teaching case. Notes are not findings from an actual participant.</footer></body></html>`;download('Lab_01_Interview_'+state.caseId+'_artifact.html',body,'text/html;charset=utf-8');say('Interview learning artifact downloaded.')}
function home(focus=false){root.innerHTML=`<main id="main" tabindex="-1"><section class="panel hero"><p class="eyebrow">Design Thinking Learning Lab · Lab 1 of 6</p><h1 id="main-heading" tabindex="-1">Interview Simulator</h1><p class="lede">Practice empathy through a branching stakeholder interview. Ask about real experiences, listen for useful evidence, and distinguish a need from an assumed solution.</p><p>There are two consistent cases. Continue with the same person in Problem Framing, Idea Generation, Idea Selection, Rapid Prototyping, and Test & Iterate.</p><div class="subtle"><strong>How to practice</strong><ol><li>Ask one question at a time. Your choice changes the response and the next available follow-ups.</li><li>Look for concrete experiences and exceptions, not quick agreement with your solution.</li><li>When you have enough evidence, end the interview, reflect, and export notes for the next lab.</li></ol></div></section><div class="grid two" style="margin-top:20px">${Object.keys(CASES).map(id=>{const c=CASES[id],s=load(id);return `<section class="panel case-card"><span class="chip blue">${esc(c.persona)} · ${id==='campus'?'Student experience':'Customer experience'}</span><h2>${esc(c.title)}</h2><p>${esc(c.descriptor)}. ${esc(c.context)}</p><p class="small">${s.turns.length} questions asked on this device</p><div class="row"><button class="btn primary" type="button" data-act="start" data-case="${id}">${s.turns.length?'Continue interview':'Start interview'}</button><button class="btn quiet sm" type="button" data-act="reset" data-case="${id}">Start over</button></div></section>`}).join('')}</div><section class="panel" style="padding:22px;margin-top:20px"><h2 style="font-size:1.3rem">Interviewing principles</h2><div class="grid two"><div><h3>Ask about experience</h3><p>“Tell me about the last time…” and “What happened next?” usually uncover actual behavior.</p></div><div><h3>Watch for weak evidence</h3><p>Leading, hypothetical, and closed questions can produce agreement without explaining what happened.</p></div></div><p class="small">The scenarios are fictional learning simulations. No microphone, real interviews, or personal data are required.</p></section></main>`;if(focus)root.querySelector('#main-heading')?.focus({preventScroll:true})}
function start(id){state=load(id);render('main-heading');say('Interview started for '+names[id])}
function choose(index){const c=CASES[state.caseId],node=c.nodes[state.current],opt=node.options[index];if(!opt)return;const next=c.nodes[opt[1]];if(!next)return;const turn={question:opt[0],kind:opt[2],response:next.response,coach:next.coach||'',node:opt[1],evidence:next.evidence||''};state.turns.push(turn);state.current=opt[1];if(next.evidence&&!state.evidence.some(n=>n.text===next.evidence)){state.evidence.push({text:next.evidence,source:c.persona+' · simulated interview'})}save();render('latest-response');say('Response received from '+c.persona+'. '+(next.evidence?'A finding was added.':''))}
function addNote(){const t=state.draft.trim();if(t.length<15){say('Write a finding of at least 15 characters.');root.querySelector('#note-draft')?.focus();return}if(state.extraNotes.length>=15){say('Maximum of 15 additional notes.');return}state.extraNotes.push(t.slice(0,450));state.draft='';save();render('note-draft');say('Field note added.')}
function finish(){state.finished=true;save();render('main-heading');say('Interview finished. Add your reflection and download the notes.')}
function render(focus){if(!state){home();return}const c=CASES[state.caseId],node=c.nodes[state.current],last=state.turns.at(-1),canEnd=state.turns.length>=2;root.innerHTML=`<div class="row between"><button class="btn outline sm" data-act="home" type="button">← Choose a scenario</button><span class="chip">${esc(c.persona)} · ${esc(c.title)}</span></div><div class="stage-shell"><main id="main" class="panel stage-panel" tabindex="-1"><div class="stage-strap"><span class="chip red">Lab 1 of 6</span><span class="chip ${state.finished?'green':'blue'}">${state.finished?'Interview complete':'Interview in progress'}</span></div><h1 id="main-heading" tabindex="-1">Interview Simulator</h1><p>${esc(c.descriptor)}</p><div class="case-strip"><strong>Context</strong><p>${esc(c.context)}</p></div>${state.finished?report(c):interview(c,node,last,canEnd)}</main><aside class="panel coach" aria-labelledby="coach-heading"><p class="eyebrow">Learning coach</p><h2 id="coach-heading">Interview guidance</h2><p>Ask about something the stakeholder <strong>actually did</strong>, then follow the unexpected details.</p><ul><li>What happened before or after the difficult moment?</li><li>Was there a time the problem did <em>not</em> happen?</li><li>What are you assuming rather than observing?</li></ul><p class="small">The next lab turns your interview findings into a problem frame.</p><div class="subtle"><strong>Findings recorded</strong><p class="metric">${notes().length}</p><p class="small">These are simulated evidence excerpts. You must still evaluate them in the Problem Framing lab.</p></div><button class="btn outline sm" type="button" data-act="download-notes">Download notes JSON</button><details><summary>Privacy and limitations</summary><p class="small">All people and quotes are fictional. This lab runs locally in the browser; your input is not sent to a server. Do not enter personally identifying interview details.</p></details></aside></div>`;const el=root.querySelector('#'+focus)||root.querySelector('#main-heading');el?.focus({preventScroll:true});if(focus==='latest-response')el?.scrollIntoView({block:'center'});else if(focus==='main-heading')window.scrollTo({top:0,behavior:'instant'});
}
function interview(c,node,last,canEnd){const options=node.options||[];return `<section class="section first" aria-label="Interview conversation"><h2 class="plain-heading">Conversation with ${esc(c.persona)}</h2><div class="conversation"><div class="message user"><strong>Interviewer</strong><p>${esc(c.opening)}</p></div><div class="message stakeholder"><strong>${esc(c.persona)}</strong><p>${esc(c.greeting)}</p></div>${state.turns.slice(0,-1).map(t=>`<div class="message user"><strong>You asked</strong><p>${esc(t.question)}</p></div><div class="message stakeholder"><strong>${esc(c.persona)}</strong><p>${esc(t.response)}</p></div>`).join('')}${last?`<div class="message user"><strong>You asked</strong><p>${esc(last.question)}</p></div><div class="message stakeholder latest" aria-label="Most recent stakeholder response"><h3 id="latest-response" tabindex="-1">Latest response from ${esc(c.persona)}</h3><p>${esc(last.response)}</p></div><div class="feedback"><strong>Interview coach</strong><p>${esc(last.coach)}</p>${last.evidence?`<p><strong>Finding captured:</strong> ${esc(last.evidence)}</p>`:'<p>No new directly observed finding captured from this question.</p>'}</div>`:''}</div></section><section class="section" aria-labelledby="next-heading"><h2 id="next-heading">What will you ask next?</h2>${options.length?`<div class="option-list">${options.map((opt,i)=>`<button type="button" class="interview-choice" data-act="choose" data-index="${i}">${esc(opt[0])}</button>`).join('')}</div>`:'<div class="notice">You reached the end of this line of questioning. You can finish and reflect, or restart to explore another path.</div>'}<div class="row" style="margin-top:18px"><button type="button" class="btn outline" data-act="finish" ${canEnd?'':'disabled'}>End interview and reflect</button></div><p class="small">${canEnd?'You can finish now, but a deeper interview may reveal more evidence.':'Ask at least two questions before ending.'}</p></section><section class="section" aria-labelledby="findings-heading"><h2 id="findings-heading">Evidence collected so far</h2>${notes().length?`<ul class="help-list">${notes().map(n=>`<li>${esc(n.text)}</li>`).join('')}</ul>`:'<p>Nothing recorded yet. Try a question about a specific past experience.</p>'}<div class="field"><label for="note-draft">Optional additional interview finding</label><textarea id="note-draft" rows="2" maxlength="450" aria-describedby="note-help">${esc(state.draft)}</textarea><small id="note-help">Record a specific quote or behavior, not your proposed solution. Avoid identifying information.</small></div><button class="btn quiet sm" type="button" data-act="add-note">Add finding</button></section>`}
function report(c){return `<section class="section first"><h2>Reflect on the interview</h2><p>You asked <strong>${state.turns.length}</strong> questions and recorded <strong>${notes().length}</strong> findings. This is a branching practice scenario, not a real interview.</p><div class="field"><label for="reflection">Which evidence most changes how you understand this person's experience?</label><textarea id="reflection" rows="5" maxlength="1500" aria-describedby="reflection-help">${esc(state.reflection)}</textarea><small id="reflection-help">Use concrete interview findings and explain what you still do not know.</small></div><div class="row"><button class="btn primary" type="button" data-act="download-notes">Download notes for Problem Framing (JSON)</button><button class="btn outline" type="button" data-act="download-report">Download full learning artifact (HTML)</button><button class="btn quiet" type="button" data-act="resume">Return to interview</button></div></section><section class="section"><h2>Captured findings</h2><ol class="help-list">${notes().map(n=>`<li>${esc(n.text)}</li>`).join('')||'<li>No findings recorded yet. Return to the interview for more evidence.</li>'}</ol><p class="small">In the next lab, you will classify these findings and challenge your initial assumptions.</p></section><section class="section"><h2>Questions you explored</h2><ol class="help-list">${state.turns.map(t=>`<li><strong>${esc(t.question)}</strong><p>${esc(t.response)}</p></li>`).join('')}</ol></section>`}
root.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;switch(b.dataset.act){case 'start':start(b.dataset.case);break;case 'reset':if(confirm('Clear this interview for the selected case?')){try{localStorage.removeItem(key(b.dataset.case))}catch(e){}home(true);say('Interview restarted.')}break;case 'home':state=null;home(true);say('Choose a scenario.');break;case 'choose':choose(Number(b.dataset.index));break;case 'add-note':addNote();break;case 'finish':finish();break;case 'resume':state.finished=false;save();render('main-heading');break;case 'download-notes':downloadNotes();break;case 'download-report':downloadReport();break;}});
root.addEventListener('input',e=>{if(!state)return;if(e.target.id==='reflection'){state.reflection=e.target.value.slice(0,1500);save()}if(e.target.id==='note-draft'){state.draft=e.target.value.slice(0,450);save()}});
home();
})();
</script></body></html>
