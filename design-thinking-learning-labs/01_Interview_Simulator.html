*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.58 Arial,Helvetica,sans-serif}h1,h2,h3,h4,p{margin-top:0}h1,h2{font-family:Georgia,'Times New Roman',serif;line-height:1.18;letter-spacing:-.025em}h1{font-size:clamp(2rem,3.65vw,3.05rem);margin-bottom:14px}h2{font-size:clamp(1.48rem,2.8vw,2.15rem);margin-bottom:14px}h3{font-size:1.12rem;margin-bottom:8px;line-height:1.3}p{margin-bottom:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.58}input,textarea,select{width:100%;min-height:45px;border:1px solid #8C8F90;background:#fff;color:#202124;border-radius:8px;padding:10px 12px}textarea{min-height:110px;resize:vertical}input[type="checkbox"],input[type="radio"]{width:19px;height:19px;min-height:19px;flex:none;accent-color:var(--red);margin:3px 4px 0 0}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,[tabindex="-1"]:focus-visible{outline:3px solid var(--slate);outline-offset:3px}a{color:var(--red-dark);text-underline-offset:3px}a:hover{text-decoration-thickness:2px}[hidden]{display:none!important}.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}.skip-link{position:absolute;top:-100px;left:18px;z-index:999;background:#fff;color:#141414;border:3px solid #141414;padding:9px 16px}.skip-link:focus{top:12px}h1[tabindex="-1"]:focus{outline:none}.masthead{background:var(--red);color:white}.masthead-inner{max-width:1250px;padding:17px 26px;margin:auto;display:flex;gap:15px;align-items:center;justify-content:space-between}.app-name{font:700 1.37rem/1.2 Georgia,'Times New Roman',serif;letter-spacing:-.01em}.app-meta{font-size:.85rem;font-weight:700;opacity:.96}.shell{max-width:1250px;margin:0 auto;padding:26px}.panel{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:15px;min-width:0}.hero{border-top:6px solid var(--red);padding:clamp(24px,4vw,44px)}.eyebrow{color:var(--red-dark);font-size:.78rem;letter-spacing:.11em;font-weight:800;text-transform:uppercase;margin:0 0 12px}.lede{font-size:1.12rem;color:#3d4247;max-width:780px}.muted,.small{color:var(--muted)}.small{font-size:.87rem}.micro{font-size:.76rem;color:var(--muted)}.grid{display:grid;gap:18px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px 17px;min-height:46px;border-radius:9px;border:2px solid transparent;font-weight:700;line-height:1.3;background:white;color:var(--ink)}.btn:hover:not(:disabled){filter:brightness(.96)}.btn.primary{background:var(--red);color:white;border-color:var(--red)}.btn.primary:hover:not(:disabled){background:var(--red-dark);border-color:var(--red-dark)}.btn.outline{color:var(--slate);border-color:var(--slate)}.btn.quiet{border-color:var(--line);background:white}.btn.danger{color:var(--red-dark);border-color:#C98A96}.btn.sm{min-height:43px;font-size:.86rem;padding:8px 12px}.btn.block{width:100%}.chip{display:inline-flex;gap:5px;align-items:center;border-radius:999px;background:var(--pale);padding:4px 11px;font-weight:700;font-size:.75rem;color:#30343A}.chip.red{background:var(--red);color:#fff}.chip.green{background:var(--green-pale);color:var(--green)}.chip.blue{background:var(--blue-pale);color:var(--slate)}.case-card{padding:24px;border-top:5px solid var(--slate)}.case-card h2{font-size:1.55rem}.case-card .btn{margin-top:10px}.case-card p{min-height:70px}.case-card[aria-current="true"]{border-color:var(--red);border-top-color:var(--red)}.feature-list{padding:0;margin:14px 0;list-style:none}.feature-list li{padding:8px 0 8px 27px;position:relative}.feature-list li:before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:900}.stage-shell{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:18px;align-items:start}.stage-panel{padding:clamp(19px,3vw,33px)}.coach{padding:22px;position:sticky;top:18px}.coach h2{font-size:1.34rem}.coach ul{padding-left:18px}.coach li{margin:10px 0}.case-strip{background:var(--blue-pale);border:1px solid #D4E0EA;border-radius:11px;padding:17px 18px;margin:19px 0}.case-strip p:last-child{margin:0}.tabs-wrap{background:#fff;padding:18px 20px;margin-top:20px}.tabs-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:13px}.tabs-top strong{font-size:.91rem}.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.tab{display:flex;flex-direction:column;gap:4px;justify-content:center;min-height:70px;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--cream);color:#34383C;padding:9px 11px}.tab .number{font-size:.73rem;font-weight:800;letter-spacing:.03em}.tab .name{font-size:.88rem;line-height:1.32;font-weight:800}.tab[aria-current="step"]{border:2px solid var(--red);background:#FFF7F8;color:var(--red-dark)}.tab.complete .number:after{content:" · Complete";color:var(--green)}.progressbar{height:6px;margin-top:14px;border-radius:7px;background:var(--pale);overflow:hidden}.progressbar>span{display:block;height:100%;background:var(--red);transition:width .15s}.stage-strap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}.stage-title p{max-width:800px;color:#46494c}.section{border-top:1px solid var(--line);padding-top:25px;margin-top:29px}.section.first{border-top:0;margin-top:0;padding-top:0}.section-heading{display:flex;gap:10px;align-items:center;margin-bottom:12px}.step-number{background:var(--red);color:#fff;border-radius:50%;height:29px;width:29px;display:inline-grid;place-items:center;font-weight:800;font-size:.83rem;flex:none}.section-heading h2{font:700 1.3rem/1.3 Arial,Helvetica,sans-serif;letter-spacing:0;margin:0}.subtle{padding:15px 18px;border-radius:10px;background:var(--cream);border:1px solid var(--line);margin:14px 0}.subtle strong{display:block;margin-bottom:5px}.notice{background:#fff8eb;border-left:5px solid #9F681E;padding:14px 16px;border-radius:6px;margin:15px 0}.success{background:var(--green-pale);border-left:5px solid var(--green);padding:14px 16px;border-radius:6px;margin:15px 0}.feedback{background:var(--blue-pale);border-left:5px solid var(--slate);padding:16px;border-radius:7px;margin:16px 0}.feedback h3{margin-bottom:7px}.feedback p:last-child{margin-bottom:0}.label{font-weight:700;display:block;margin-bottom:6px}.hint{font-size:.82rem;color:var(--muted);margin:4px 0 10px}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field small{display:block;color:var(--muted);font-size:.8rem;margin:4px 0 0}.evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.evidence-card{border:1px solid var(--line);border-radius:10px;padding:17px;background:#fff;min-width:0}.evidence-card .meta{display:flex;align-items:center;gap:7px;justify-content:space-between;flex-wrap:wrap;margin-bottom:11px}.source{color:#354b5c;background:var(--blue-pale);padding:3px 8px;font-size:.73rem;border-radius:5px;font-weight:700}.evidence-card p{font-size:.98rem;margin:0 0 12px}.segmented{display:flex;flex-wrap:wrap;gap:5px}.segmented .choice{background:white;border:1px solid #949897;border-radius:8px;padding:8px 9px;font-size:.78rem;font-weight:700;min-height:43px;color:#34383d}.segmented .choice[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:white}.evidence-response{border-top:1px solid var(--line);padding-top:10px;margin-top:11px;font-size:.84rem}.evidence-response.ok{color:var(--green)}.evidence-response.caution{color:var(--red-dark)}.option-list{display:grid;gap:12px;margin:15px 0}.option{display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);padding:17px;border-radius:10px;background:white}.option:has(input:checked){border:2px solid var(--slate);background:var(--blue-pale);padding:16px}.option strong{display:block;margin-bottom:5px}.option .small{display:block}.flag{display:flex;gap:10px;align-items:flex-start;min-height:42px;margin:8px 0}.flag input{margin-top:4px}.help-list{margin:7px 0 8px;padding-left:20px}.help-list li{margin:6px 0}.write-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.insight-preview{padding:17px 19px;background:#fff7f8;border:1px solid #E7C4CB;border-left:5px solid var(--red);border-radius:9px;margin-top:15px}.insight-preview p{margin-bottom:5px}.module-actions{border-top:1px solid var(--line);padding-top:24px;margin-top:30px;display:flex;align-items:center;gap:11px;justify-content:space-between;flex-wrap:wrap}.idea-card{border:1px solid var(--line);padding:16px;border-radius:10px;background:#fff}.idea-card .row{justify-content:space-between}.idea-text{white-space:pre-wrap;margin:9px 0}.tag{font-size:.76rem;font-weight:800;color:var(--slate)}.technique{border:1px solid var(--line);background:#fff;padding:14px;min-height:76px;border-radius:10px;text-align:left;width:100%;color:var(--ink)}.technique[aria-pressed="true"]{border:2px solid var(--red);background:#fff7f8;color:var(--red-dark)}.technique strong,.technique small{display:block}.technique small{color:#575a5d;font-weight:400;margin-top:5px}.constraint{border:1px solid #D6C293;background:#FFF9E9;border-radius:9px;padding:16px;margin:15px 0}.rating-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.rating-grid label{font-weight:700;font-size:.86rem;display:block}.rating-grid select{margin-top:5px}.score{font:800 1.18rem Arial,sans-serif;color:var(--slate);white-space:nowrap}.ranked{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--cream);border-radius:9px;padding:13px 15px;margin:9px 0}.proto-step{border:1px solid var(--line);border-radius:10px;padding:18px;margin:13px 0;background:white}.proto-step .count{background:var(--pale);border-radius:7px;padding:5px 10px;font-weight:800;color:#414141}.proto-step .fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:8px}.proto-step .field{margin:6px 0}.proto-preview{border-left:4px solid var(--red);background:#fff7f8;padding:18px;border-radius:8px;margin:13px 0}.proto-preview .small{white-space:pre-wrap}.testing-metric{border:1px solid var(--line);border-radius:9px;background:var(--cream);padding:16px}.testing-metric strong{font-size:1.25rem;display:block}.mode-note{border:1px solid var(--line);border-left:5px solid var(--slate);background:#f7f9fa;border-radius:8px;padding:15px;margin:13px 0}details{margin:17px 0}summary{cursor:pointer;font-weight:700;padding:10px 4px}details .details-content{padding:8px 16px 19px;border:1px solid var(--line);background:var(--cream);border-radius:9px}.footer{max-width:1250px;margin:0 auto;padding:2px 26px 36px;color:var(--muted);font-size:.83rem}.footer .divider{border-top:1px solid var(--line);padding-top:17px;margin-top:25px}.count{font-variant-numeric:tabular-nums}.feedback:focus,.notice:focus{outline:3px solid var(--slate)}

</style></head><body><a class="skip-link" href="#main">Skip to main content</a><header class="masthead"><div class="masthead-inner"><div class="app-name">Design Thinking Learning Lab</div><div class="app-meta">Lab 1 of 6 · Interview Simulator</div></div></header><div id="live-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div><div id="app" class="shell"></div><footer class="footer"><div class="divider">These cases and simulated responses are fictional and were developed with the help of ChatGPT. No real participant data is collected.</div></footer><script>
(()=>{'use strict';
const CASES={"campus": {"title": "Campus events", "persona": "Jordan", "descriptor": "A commuter student deciding whether to attend campus events", "context": "Jordan is a 19-year-old commuter student who travels about 35 minutes each way. Campus activities can compete with class schedules, work, and the trip home.", "opening": "Thanks for talking with me. I’m trying to understand what students experience when they consider campus events. There are no right answers. Could you share what it’s been like for you?", "greeting": "Sure. I have seen events I thought might be interesting, but I usually leave campus after class.", "nodes": {"start": {"options": [["Tell me about the last time you considered attending a campus event.", "past", "behavioral"], ["Why don’t commuter students participate in campus events?", "why", "judgmental"], ["Would more social-media advertising make you attend?", "posters", "leading"]]}, "why": {"response": "I’m not sure about everyone else. I guess we’re all busy.", "coach": "A “why don’t you” framing invites generalizations and defensiveness. Recover with an actual recent experience.", "options": [["What is your routine after your last class?", "routine", "behavioral"], ["Can you recall one event you considered but skipped?", "past", "behavioral"]]}, "posters": {"response": "Maybe. I already see some posts about events, though.", "coach": "Agreeing with a proposed fix is not evidence that awareness is the problem. Ask what happened after seeing a post.", "options": [["What happened the last time you saw an event announcement?", "past", "behavioral"], ["Where did you notice the event information?", "messages", "behavioral"]]}, "past": {"response": "There was a career event last month. I saw it on Instagram and thought it sounded useful. It started at six, but my last class ended around two-thirty.", "evidence": "Jordan knew about a career event but the gap between class and its start time affected attendance.", "coach": "A specific past event is more useful than a prediction. Explore the sequence and the decision.", "options": [["Walk me through what happened after your class that day.", "routine", "behavioral"], ["Where did you look for the location and schedule?", "messages", "behavioral"], ["If it started at three, would you definitely have gone?", "hypothetical", "hypothetical"]]}, "routine": {"response": "I usually go straight to my car. It takes me about thirty-five minutes to get home, and once I leave I almost never come back that evening.", "evidence": "Jordan typically leaves after class and a 35-minute commute makes returning unlikely.", "coach": "This reveals a practical constraint, not necessarily a lack of interest. Look for exceptions.", "options": [["Can you remember a time you did stay for something?", "exception", "behavioral"], ["What made you decide to leave on the career-event day?", "gap", "behavioral"], ["Would free food convince you to stay?", "free_food", "leading"]]}, "gap": {"response": "It felt like a lot of time to kill, and I had homework and a shift the next morning. I was not going to sit around for hours.", "evidence": "Long unstructured gaps, study obligations, and other commitments influence Jordan’s decisions.", "coach": "The issue might be time use and predictability rather than event promotion.", "options": [["What would make a gap between class and an event feel useful?", "productive", "open"], ["Which days tend to work better for you?", "schedule", "behavioral"]]}, "hypothetical": {"response": "Maybe. Three sounds better, but I really don’t know what I would do.", "coach": "Hypothetical commitment is weak evidence. Ask about an event Jordan actually attended.", "options": [["Tell me about a time you stayed after class for an activity.", "exception", "behavioral"], ["What kinds of gaps have you actually waited through?", "threshold", "behavioral"]]}, "free_food": {"response": "I like free food, but it probably would not make me wait three hours.", "evidence": "A food incentive alone is unlikely to overcome a long scheduling gap for Jordan.", "coach": "Jordan challenged a solution-first assumption. Explore the actual conditions of participation.", "options": [["What was different on a day you did stay?", "exception", "behavioral"], ["What would make staying feel worthwhile?", "productive", "open"]]}, "exception": {"response": "I stayed once for a club workshop because it started about twenty minutes after class. A friend told me what it would be like and met me there.", "evidence": "Jordan has attended when timing was convenient and a friend helped explain the experience.", "coach": "Exceptions are powerful: they complicate “students are uninterested” and point toward testable conditions.", "options": [["Which mattered more that day: the timing or your friend?", "priority", "comparison"], ["What did your friend tell you that helped?", "belonging", "open"], ["How did you find the event information?", "messages", "behavioral"]]}, "priority": {"response": "Timing first. If it was three hours later, even having a friend there might not have helped.", "evidence": "Jordan describes event timing as more important than companionship when the gap is very long.", "coach": "A comparison helps weigh factors without declaring one universal cause.", "options": [["How long a gap have you actually stayed through?", "threshold", "behavioral"], ["What else made that workshop feel approachable?", "belonging", "open"]]}, "belonging": {"response": "I knew where to go and what people would do. I would not have been comfortable showing up alone without knowing any of that.", "evidence": "Knowing the location, format, and social expectations helped Jordan feel comfortable attending.", "coach": "The need includes confidence and expectations, not just scheduling.", "options": [["Have event descriptions ever been confusing or inconsistent?", "messages", "behavioral"], ["What did you look for when you arrived?", "arrival", "behavioral"]]}, "messages": {"response": "For one event I saw three different announcements, and I could not tell whether the location had changed. The posts did not all say the same thing.", "evidence": "Conflicting announcements made Jordan uncertain which event location was accurate.", "coach": "This supports an information-reliability need; it does not automatically justify creating another app.", "options": [["What did you do when you noticed the different locations?", "checking", "behavioral"], ["What information would you need before deciding to stay?", "needed_info", "open"]]}, "checking": {"response": "I checked one more account and then gave up. It was not worth finding out if I was looking at an old post.", "evidence": "Jordan abandoned a search after finding conflicting event information.", "coach": "A concrete workaround or abandonment reveals where confidence was lost.", "options": [["When have the details been clear enough for you?", "exception", "comparison"], ["What information should be reliable first?", "needed_info", "open"]]}, "needed_info": {"response": "The time, location, how long it lasts, and what I would actually be doing. Otherwise I cannot tell whether it fits my day.", "evidence": "Jordan wants reliable time, location, duration, and activity expectations before committing.", "coach": "This is a stakeholder need that can support many different solution concepts.", "options": [["What would happen if you arrived alone?", "arrival", "open"], ["Which of those details has caused an actual problem?", "messages", "behavioral"]]}, "arrival": {"response": "If I know where to go and what people will actually do, I’m more likely to consider it. Walking in alone without a plan is awkward.", "evidence": "Jordan reports that clear arrival guidance and activity expectations increase confidence about attending.", "coach": "The interview reveals practical and social dimensions. Keep them distinct when framing the problem.", "options": [["What was arrival like at the workshop you attended?", "belonging", "behavioral"], ["Which days tend to fit better?", "schedule", "behavioral"]]}, "productive": {"response": "If I could study with someone or meet a professor in between, staying might feel productive. Just waiting doesn’t.", "evidence": "A useful activity during a gap may make staying on campus more worthwhile for Jordan.", "coach": "This is a promising condition to investigate, not yet a validated design feature.", "options": [["Which days might such a gap occur?", "schedule", "behavioral"], ["What has happened when you tried staying before?", "exception", "behavioral"]]}, "schedule": {"response": "Tuesday and Thursday are usually better. Some other days I finish really early or have work afterward.", "evidence": "Jordan’s availability varies by day because of class and work timing.", "coach": "Specific scheduling patterns reveal that the problem is not uniform across students or days.", "options": [["How long would you realistically stay after class?", "threshold", "behavioral"], ["What details help you decide in advance?", "needed_info", "open"]]}, "threshold": {"response": "Maybe forty-five minutes to an hour at most. More than that and I start thinking about getting home.", "evidence": "Jordan estimates a practical waiting tolerance of roughly 45–60 minutes, but this needs further observation.", "coach": "Threshold estimates are useful but should be checked against observed behavior rather than treated as precise measurements.", "options": [["Tell me about an event you did attend.", "exception", "behavioral"], ["What happened when the gap was longer?", "gap", "behavioral"]]}}}, "pickup": {"title": "Customer pickup experience", "persona": "Elena", "descriptor": "A first-time online-order pickup customer at Riverbend Home & Garden", "context": "Elena purchased items online for pickup at Riverbend Home & Garden. Your team wants to understand the customer’s experience from arrival through handoff without assuming the problem is speed.", "opening he counter.", "evidence": "Elena wanted a clear acknowledgment that her order had entered the pickup process.", "coach": "The user described a need for status information; multiple designs might address it.", "options": [["What happened at the handoff?", "handoff", "behavioral"], ["What did you do when you were uncertain?", "checking", "behavioral"]]}, "checking": {"response": "I checked my email again and looked around at other customers. I still did not know which place was right until someone waved me over.", "evidence": "Elena relied on her email, other customers, and staff gestures to recover from unclear direction.", "coach": "Look for where the journey forces customers to guess or ask someone.", "options": [["What happened when staff recognized you?", "checkin", "behavioral"], ["How was your order handed over?", "handoff", "behavioral"]]}, "handoff": {"response": "I got the bag quickly, but I still did not know if I had everything. Nobody said how many items there should be or what to do if something was missing.", "evidence": "Elena received the order promptly but lacked confirmation that all items were included.", "coach": "Task completion and confidence in completion are different outcomes.", "options": [["How did you check whether the order was complete?", "verify", "behavioral"], ["What information would have reassured you?", "missing", "open"], ["Would automated lockers fix the issue?", "lockers", "leading"]]}, "lockers": {"response": "I’m not sure. A locker could still give me the wrong bag.", "coach": "Automating the handoff does not necessarily resolve order verification. Explore the underlying need.", "options": [["What did you do to check the contents?", "verify", "behavioral"], ["What did you expect the employee to confirm?", "missing", "open"]]}, "verify": {"response": "I compared the bag to my receipt in the car. The right products were there, but I would rather know before leaving the store.", "evidence": "Elena verified the order herself after (function interviewExtensions(){
  const cases={
    campus:{
      workshop_comfort:{response:'It was a small workshop. Someone greeted us at the door and the organizer explained what we would do. I did not have to wonder whether I was interrupting anything.',evidence:'At an attended workshop, a greeting and clear activity introduction made Jordan comfortable entering.',coach:'That details an experience that worked. Compare it with a time Jordan decided not to attend.',options:[['How was that different from the career event you skipped?','compare_events','comparative'],['What about arriving alone?','arriving_alone','context'],['What did the organizer do when you entered?','organizer','behavioral']]},
      compare_events:{response:'With the workshop I knew what to expect and it began soon after class. With the career event I had a big gap and barely knew what would happen there. They were really different decisions.',evidence:'Convenient timing and clear expectations differed between an attended workshop and a skipped event.',coach:'A contrast can reveal multiple contributors; it does not prove either factor is sufficient by itself.',options:[['Was there ever a good time when you still chose not to attend?','interest_exception','contrary case'],['What else was happening that week?','work_commitment','context']]},
      arriving_alone:{response:'I would probably hover near the entrance and check my phone. I do not want to be the only one who does not know where to sit.',evidence:'Uncertainty about social expectations may affect Jordan when arriving alone.',coach:'This is a predicted reaction; seek a real example to strengthen it.',options:[['Has that actually happened at an event?','alone_example','past behavior'],['When did arriving feel easy?','workshop_comfort','positive exception']]},
      organizer:{response:'They asked if we had been there before and showed us where to start. That took maybe twenty seconds but changed the whole feeling.',evidence:'A brief personal greeting and first-step direction supported Jordan at an attended workshop.',coach:'Small moments in a service journey can matter more than sweeping technology changes.',options:[['What would have happened without the greeting?','arriving_alone','hypothetical'],['Did you still have any problems after that?','after_arrival','counterexample']]},
      alone_example:{response:'Yes. I walked into a student organization meeting once, did not recognize anyone, and left before it started because I did not know if newcomers could join.',evidence:'Jordan previously left a student meeting before it began because entry expectations were unclear.',coach:'A specific incident supports a social-entry barrier that attendance counts alone do not show.',options:[['What information would have prevented that confusion?','needed_info','information need'],['Was that event at a convenient time?','meeting_time','contrast']]},
      meeting_time:{response:'It was right after my class, actually. So the schedule was fine that time. It was just awkward to walk in.',evidence:'Jordan skipped an event even with convenient timing because the social entry felt uncertain.',coach:'This complicates a timing-only problem frame.',options:[['Tell me about an event that did feel welcoming.','workshop_comfort','positive exception'],['What did you do after leaving?','after_leaving','behavioral']]},
      after_leaving:{response:'I went to the library for a while. I was not opposed to staying; I just did not feel comfortable at that particular meeting.',evidence:'Jordan stayed on campus after leaving a socially uncomfortable event, suggesting commuting is not always the decisive barrier.',coach:'Exceptions are valuable: one intervention will not address every situation.',options:[['Did anyone follow up with you about it?','followup','follow-up'],['Tell me about your schedule on a normal day.','routine','context']]},
      followup:{response:'A club member messaged me later and said first-timers are welcome. I wish I had known that before I walked in.',evidence:'The organizer clarified newcomer expectations only after Jordan had left.',coach:'Timing of information matters: useful guidance may arrive too late.',options:[['Where would you look for that guidance?','needed_info','information'],['What would a more welcoming arrival look like?','organizer','comparison']]},
      work_commitment:{response:'I had a shift the following morning and a long assignment due. I was not going to wait until evening without a good reason.',evidence:'Work and academic responsibilities increased the cost of remaining for late events.',coach:'Notice competing priorities rather than reducing the issue to motivation.',options:[['Do your constraints change during the week?','schedule','pattern'],['How long a wait have you actually managed?','threshold','threshold']]},
      interest_exception:{response:'Yes. There was a film night right after class. I knew about it, but it was not something I was interested in. Sometimes the topic really is the reason.',evidence:'Jordan has skipped a well-timed, well-publicized event because the activity itself was not appealing.',coach:'A realistic problem frame should acknowledge that not every absence has the same cause.',options:[['How do you decide whether an event is interesting?','interest_cues','decision criteria'],['Compare that with the workshop you attended.','compare_events','contrast']]},
      interest_cues:{response:'I look for what we would actually do and who it might be useful for. A title like “student engagement night” means almost nothing to me.',evidence:'Specific activity descriptions help Jordan decide whether an event is personally worthwhile.',coach:'Specific behavioral cues are more useful than general claims that students want better advertising.',options:[['What made that workshop description useful?','workshop_comfort','positive exception'],['Did you ever receive conflicting information?','messages','other barrier']]},
      transport_access:{response:'If I have my car, parking itself is not much of a problem. But I give someone a ride on Thursdays, so I cannot always stay late even if I want to.',evidence:'Jordan sometimes has a shared-ride obligation that limits staying later on campus.',coach:'Accessibility and logistics can affect decisions without being universal barriers.',options:[['How do you handle those shared-ride days?','ride_planning','behavioral'],['Does that change how early you plan?','schedule','pattern']]},
      ride_planning:{response:'We agree on a departure time before class. If I hear about an event after that, it is too late to rearrange things.',evidence:'Advance notice is important for Jordan because shared-ride departure plans are made before events are considered.',coach:'Event information timing and reliable schedules can interact with transportation constraints.',options:[['What details do you need in advance?','needed_info','information'],['What happens when event posts disagree?','messages','contradiction']]},
      after_arrival:{response:'The workshop was fine, but it ended later than I expected. I had to leave before the final activity, which was disappointing.',evidence:'An unclear event end time caused Jordan to leave a workshop before its final activity.',coach:'A partial success exposes an additional need: reliable duration and departure planning.',options:[['Did you know how long it was supposed to last?','needed_info','information'],['How would you plan next time?','schedule','pattern']]}
    },
    pickup:{
      walk_from_car:{response:'I parked and went through the main doors. The confirmation email said pickup was ready, but once inside I saw customer service and returns with signs that looked almost identical.',evidence:'Elena had a ready email but lacked a clear route from the entrance to the correct pickup counter.',coach:'A walkthrough reveals the point where information failed in context.',options:[['What did you notice before the signs?','visual_order','attention'],['What was your first move?','lines','behavioral'],['Did the email say where to go?','email','contrast']]},

      bag_seal:{response:'The bag had my name, but it was sealed. I could not tell whether the small items were inside without opening it right there.',evidence:'A sealed bag with a name label did not reassure Elena that all purchased items were present.',coach:'Identity confirmation is not the same as completeness confirmation.',options:[['What did you do to check?','verify','actual behavior'],['Was anything actually missing?','actual_missing','contradiction']]},
      actual_missing:{response:'Nothing was missing, as far as I could tell when I checked in the car. The problem was not a failed order—it was being unable to tell whether it was complete.',evidence:'Elena ultimately received the correct order but lacked confidence at handoff.',coach:'Do not rewrite uncertainty as an actual fulfillment error.',options:[['When did you finally feel sure?','verify','time'],['What support would you expect if something were missing?','missing','recovery']]},
      first_repeat:{response:'I had never used their pickup process before. If I came again, I would probably go straight to the right counter, but I would still want confirmation that all the items were there.',evidence:'Familiarity could reduce wayfinding difficulty but would not necessarily resolve completeness uncertainty.',coach:'One persona may experience different barriers on first and later visits.',options:[['What confused you the first time?','arrival','initial barrier'],['What would reassure you next time?','missing','underlying need']]},
      no_phone:{response:'My phone had very little signal inside the store. I had the order email saved, but I would not want a process where I had to load a new web page just to check in.',evidence:'Poor indoor phone signal could undermine a mandatory mobile-only pickup step.',coach:'Consider digital accessibility and fallbacks before proposing another app.',options:[['What did you use instead?','checking','workaround'],['Would staff guidance help?','staff','human fallback']]},
      signage_distance:{response:'I had to walk close enough to be almost in one line before I could read the labels. By then it felt awkward to switch.',evidence:'Counter signs became readable only after Elena was already near a queue.',coach:'Wayfinding information should arrive before a customer commits to a route.',options:[['What caught your eye first?','visual_order','attention'],['Did staff correct it?','staff','recovery']]},
      accessibility_angle:{response:'I can read small signs if I walk right up, but someone carrying bags or using a wheelchair might have a harder time weaving around the displays. I did not test that.',evidence:'Elena observed a cluttered path but cannot confirm accessibility for other users.',coach:'This is a hypothesis about other users: validate it with appropriate stakeholders rather than treating it as their testimony.',options:[['What part of the route felt crowded to you?','rush','actual experience'],['How would you avoid assuming others feel the same?','quiet_day','contrast']]}
    }

    campus:[['Tell me about a time an event did feel welcoming.','workshop_comfort','positive exception'],['Did you ever leave an event even though its time was convenient?','alone_example','contrasting case'],['How do work obligations or shared rides affect your plans?','transport_access','context'],['Has a convenient, well-advertised event ever simply not interested you?','interest_exception','counterexample'],['What made arriving at an event awkward?','arriving_alone','experience'],['What happened after you arrived at a workshop?','after_arrival','journey']],

function downloadNotes(){const c=CASES[state.caseId];const lines=[`INTERVIEW SIMULATOR — ${c.title}`,`Stakeholder: ${c.persona}`,`Fictional teaching case developed with the help of ChatGPT.`, '', 'QUESTIONS AND RESPONSES']; for(const [i,t] of state.turns.entries()){lines.push(`${i+1}. Q: ${t.question}`,`   ${c.persona}: ${t.response}`,`   Coach: ${t.coach}`)}lines.push('', 'FIELD NOTES'); for(const [i,n] of notes().entries())lines.push(`${i+1}. ${n.text}`);lines.push('', 'REFLECTION',state.reflection||'Not entered');download('Lab_01_Interview_'+state.caseId+'_notes.txt',lines.join('\n'),'text/plain;charset=utf-8');say('Text interview notes downloaded. Each later lab starts with its own sample evidence.');}
function downloadReport(){const c=CASES[state.caseId];const items=state.turns.map((t,i)=>`<li><p><strong>Question ${i+1}:</strong> ${esc(t.question)}</p><p><strong>${esc(c.persona)}:</strong> ${esc(t.response)}</p><p>${esc(t.coach)}</p></li>`).join('');const evidence=notes().map(x=>`<li>${esc(x.text)}</li>`).join('');const body=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview learning artifact · ${esc(c.title)}</title><style>body{max-width:850px;margin:0 auto;padding:30px;color:#202124;font:16px/1.6 Arial,sans-serif}h1,h2{font-family:Georgia,serif}h1{border-bottom:5px solid #C41230;padding-bottom:16px}h2{color:#9A0C26}li{margin:12px 0}p{white-space:pre-wrap}</style></head><body><h1>Interview Simulator · ${esc(c.title)}</h1><p>Persona: ${esc(c.persona)} · ${esc(c.descriptor)}</p><h2>Interview path</h2><ol>${items}</ol><h2>Findings</h2><ol>${evidence}</ol><h2>Reflection</h2><p>${esc(state.reflection)}</p><footer>These cases and simulated responses are fictional and were developed with the help of ChatGPT.</footer></body></html>`;download('Lab_01_Interview_'+state.caseId+'_artifact.html',body,'text/html;charset=utf-8');say('Interview learning artifact downloaded.')}
function home(focus=false){root.innerHTML=`<main id="main" tabindex="-1"><section class="panel hero"><p class="eyebrow">Design Thinking Learning Lab · Lab 1 of 6</p><h1 id="main-heading" tabindex="-1">Interview Simulator</h1><p class="lede">Practice empathy through a branching interview. Ask about real experiences, listen, and let the answer change your next question.</p><p><strong>Try either case or both.</strong> Your two interviews are independent. Later labs each start with their own baseline evidence; you do not need to export or import any progress file.</p><div class="subtle"><strong>How it works</strong><ol><li>Choose a question. ${esc('Jordan or Elena')} takes a moment to respond, just as in a real conversation.</li><li>Follow the response or explore another topic. Not every answer supports your first assumption.</li><li>Reflect and download a readable learning artifact if your instructor asks for it.</li></ol></div></section><div class="grid two" style="margin-top:20px">${Object.keys(CASES).map(id=>{const c=CASES[id],s=load(id);return `<section class="panel case-card"><span class="chip blue">${esc(c.persona)} · ${id==='campus'?'Student experience':'Customer experience'}</span><h2>${esc(c.title)}</h2><p>${esc(c.descriptor)}. ${esc(c.context)}</p><p class="small">${s.turns.length} questions asked in this browser</p><div class="row"><button class="btn primary" data-act="start" data-case="${id}" type="button">${s.turns.length?'Continue interview':'Start interview'}</button><button class="btn quiet sm" data-act="reset" data-case="${id}" type="button" aria-label="Restart ${esc(c.persona)} interview">Start over</button></div></section>`}).join('')}</div><section class="panel" style="padding:22px;margin-top:20px"><h2 style="font-size:1.3rem">Interviewing principles</h2><div class="grid two"><div><h3>Look for behavior</h3><p>Ask about the last real experience, the next step, and cases that did not match the pattern.</p></div><div><h3>Recognize weak evidence</h3><p>Leading questions, predictions and simple agreement are less useful than detailed examples and exceptions.</p></div></div><p class="small">Cases and responses are fictional. No microphone or real personal data is required.</p></section></main>`;if(focus)root.querySelector('#main-heading')?.focus({preventScroll:true})}
function start(id){state=load(id);render('main-heading');say('Interview started for '+names[id])}
function choose(index){const c=CASES[state.caseId],node=c.nodes[state.current],opt=node.options[index];if(opt)askInterviewOption(opt)}
function askInterviewTopic(target){const opt=CASES[state.caseId].topics.find(x=>x[1]===target);if(opt)askInterviewOption(opt)}
function askInterviewOption(opt){
  if(waiting||!state)return;
  const c=CASES[state.caseId],next=c.nodes[opt[1]];
  if(!next)return;
  waiting={caseId:state.caseId,option:opt,response:next};
  render('pending-response');
  say(c.persona+' is thinking about the question.');
  const delay=2300+(state.turns.length%4)*160;
  waitTimer=setTimeout(interviewReveal,delay);
}
function interviewReveal(){
  if(!waiting||!state||waiting.caseId!==state.caseId)return;
  clearTimeout(waitTimer);
  const {option,response}=waiting,c=CASES[state.caseId]; waiting=null;waitTimer=null;
  const turn={question:option[0],kind:option[2],response:response.response,coach:response.coach||'Follow up on an actual experience rather than assuming a solution.',node:option[1],evidence:response.evidence||''};
  state.turns.push(turn);state.current=option[1];
  if(response.evidence&&!state.evidence.some(n=>n.text===response.evidence))state.evidence.push({text:response.evidence,source:c.persona+' · simulated interview'});
  save();render('latest-response');say('Response received from '+c.persona+'. '+(response.evidence?'An evidence note was added.':''));
}
function addNote(){const t=state.draft.trim();if(t.length<15){say('Write a finding of at least 15 characters.');root.querySelector('#note-draft')?.focus();return}if(state.extraNotes.length>=15){say('Maximum of 15 additional notes.');return}state.extraNotes.push(t.slice(0,450));state.draft='';save();render('note-draft');say('Field note added.')}
function finish(){state.finished=true;save();render('main-heading');say('Interview finished. Add your reflection and download the notes.')}
function render(focus){if(!state){home();return}const c=CASES[state.caseId],node=c.nodes[state.current],last=state.turns.at(-1),canEnd=state.turns.length>=2;root.innerHTML=`<div class="row between"><button class="btn outline sm" data-act="home" type="button">← Choose a scenario</button><span class="chip">${esc(c.persona)} · ${esc(c.title)}</span></div><div class="stage-shell"><main id="main" class="panel stage-panel" tabindex="-1"><div class="stage-strap"><span class="chip red">Lab 1 of 6</span><span class="chip ${state.finished?'green':'blue'}">${state.finished?'Interview complete':'Interview in progress'}</span></div><h1 id="main-heading" tabindex="-1">Interview Simulator</h1><p>${esc(c.descriptor)}</p><div class="case-strip"><strong>Context</strong><p>${esc(c.context)}</p></div>${state.finished?report(c):interview(c,node,last,canEnd)}</main><aside class="panel coach" aria-labelledby="coach-heading"><p class="eyebrow">Learning coach</p><h2 id="coach-heading">Interview guidance</h2><p>Ask about something the stakeholder <strong>actually did</strong>, then follow the unexpected details.</p><ul><li>What happened before or after the difficult moment?</li><li>Was there a time the problem did <em>not</em> happen?</li><li>What are you assuming rather than observing?</li></ul><p class="small">Later labs include their own baseline evidence, so you may explore either scenario independently.</p><div class="subtle"><strong>Findings recorded</strong><p class="metric">${notes().length}</p><p class="small">These are fictional excerpts. Compare them with the evidence provided in each later lab.</p></div><button class="btn outline sm" type="button" data-act="download-notes">Download field notes (TXT)</button><details><summary>Privacy and limitations</summary><p class="small">All people and quotes are fictional. This lab runs locally in the browser; it does not submit your work to a server. Do not enter personally identifying interview details.</p></details></aside></div>`;const el=root.querySelector('#'+focus)||root.querySelector('#main-heading');el?.focus({preventScroll:true});if(focus==='latest-response')el?.scrollIntoView({block:'center'});else if(focus==='main-heading')window.scrollTo({top:0,behavior:'instant'});
}
function interview(c,node,last,canEnd){
  const options=node.options||[],seen=new Set(state.turns.map(t=>t.node));
  const other=c.topics.filter(x=>!seen.has(x[1])&&!options.some(o=>o[1]===x[1])).slice(0,8);
  return `<section class="section first" aria-label="Interview conversation"><h2 class="plain-heading">Conversation with ${esc(c.persona)}</h2>
  <div class="conversation" aria-label="Interview transcript">
  <div class="message user"><strong>Interviewer</strong><p>${esc(c.opening)}</p></div><div class="message stakeholder"><strong>${esc(c.persona)}</strong><p>${esc(c.greeting)}</p></div>
  ${state.turns.map((t,i)=>`<div class="message user"><strong>You asked</strong><p>${esc(t.question)}</p></div><div class="message stakeholder ${i===state.turns.length-1&&!waiting?'latest':''}">${i===state.turns.length-1&&!waiting?`<h3 id="latest-response" tabindex="-1">Latest response from ${esc(c.persona)}</h3>`:`<strong>${esc(c.persona)}</strong>`}<p>${esc(t.response)}</p></div>${i===state.turns.length-1&&!waiting?`<div class="feedback"><strong>Interview coach</strong><p>${esc(t.coach)}</p>${t.evidence?`<p><strong>Finding captured:</strong> ${esc(t.evidence)}</p>`:'<p>No new direct evidence was captured. Try a past-behavior follow-up.</p>'}</div>`:''}`).join('')}
  ${waiting?`<div class="message user"><strong>You asked</strong><p>${esc(waiting.option[0])}</p></div><div class="message stakeholder thinkbox" role="status" aria-live="polite"><h3 id="pending-response" tabindex="-1">${esc(c.persona)} is thinking<span class="thinking-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></h3><p class="small">A moment to consider the question.</p><button class="btn quiet sm" data-act="reveal" type="button">Show response now</button></div>`:''}
  </div></section>
  <section class="section" aria-labelledby="next-heading"><h2 id="next-heading">What will you ask next?</h2>
  ${waiting?'<p role="status">The interviewee is preparing a response. Other interview questions will be available afterward.</p>':`${options.length?`<div class="option-list">${options.map((opt,i)=>`<button type="button" class="interview-choice" data-act="choose" data-index="${i}">${esc(opt[0])}</button>`).join('')}</div>`:'<div class="notice">This line of questioning has ended. Explore another topic or finish the interview.</div>'}
  ${other.length?`<details class="topic-picker"><summary>Explore another aspect of ${esc(c.persona)}’s experience (${other.length} more questions)</summary><div class="option-list">${other.map(t=>`<button class="interview-choice" type="button" data-act="topic" data-target="${esc(t[1])}">${esc(t[0])}</button>`).join('')}</div></details>`:''}
  <div class="row" style="margin-top:18px"><button class="btn outline" data-act="finish" type="button" ${canEnd?'':'disabled'}>End interview and reflect</button></div><p class="small">${canEnd?'You may finish at any time or take a different route to challenge your assumptions.':'Ask at least two questions before ending.'}</p>`}</section>
  <section class="section" aria-labelledby="findings-heading"><h2 id="findings-heading">Evidence collected so far</h2>${notes().length?`<ul class="help-list">${notes().map(n=>`<li>${esc(n.text)}</li>`).join('')}</ul>`:'<p>Nothing recorded yet. Ask about a particular experience.</p>'}
  <div class="field"><label for="note-draft">Optional additional interview finding</label><textarea id="note-draft" rows="2" maxlength="450" aria-describedby="note-help">${esc(state.draft)}</textarea><small id="note-help">Record a specific behavior or quote, not an assumed cause. Do not include identifying details.</small></div><button class="btn quiet sm" data-act="add-note" type="button" ${waiting?'disabled':''}>Add finding</button></section>`;
}
function report(c){return `<section class="section first"><h2>Reflect on the interview</h2><p>You asked <strong>${state.turns.length}</strong> questions and recorded <strong>${notes().length}</strong> findings. You may return to the conversation and explore alternative routes.</p><div class="field"><label for="reflection">Which evidence most changed how you understand this person's experience?</label><textarea id="reflection" rows="5" maxlength="1500" aria-describedby="reflection-help">${esc(state.reflection)}</textarea><small id="reflection-help">Point to a specific moment and explain what remains uncertain.</small></div><div class="row"><button class="btn primary" type="button" data-act="download-report">Download learning artifact (HTML)</button><button class="btn outline" type="button" data-act="download-notes">Download field notes (TXT)</button><button class="btn quiet" type="button" data-act="resume">Continue interviewing</button></div></section><section class="section"><h2>Evidence captured</h2><ol class="help-list">${notes().map(n=>`<li>${esc(n.text)}</li>`).join('')||'<li>No findings yet. Return to the interview for specific examples.</li>'}</ol><p class="small">Later simulations provide their own baseline findings; students may also refer to these notes while working.</p></section><section class="section"><h2>Questions explored</h2><ol class="help-list">${state.turns.map(t=>`<li><strong>${esc(t.question)}</strong><p>${esc(t.response)}</p></li>`).join('')}</ol></section>`}
root.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;switch(b.dataset.act){case 'start':start(b.dataset.case);break;case 'reset':if(waitTimer)clearTimeout(waitTimer);waiting=null;if(confirm('Clear this interview for the selected case?')){try{localStorage.removeItem(key(b.dataset.case))}catch(e){}home(true);say('Interview restarted.')}break;case 'home':if(waitTimer)clearTimeout(waitTimer);waiting=null;state=null;home(true);say('Choose a scenario.');break;case 'choose':choose(Number(b.dataset.index));break;case 'topic':askInterviewTopic(b.dataset.target);break;case 'reveal':interviewReveal();break;case 'add-note':addNote();break;case 'finish':finish();break;case 'resume':state.finished=false;save();render('main-heading');break;case 'download-notes':downloadNotes();break;case 'download-report':downloadReport();break;}});
root.addEventListener('input',e=>{if(!state)return;if(e.target.id==='reflection'){state.reflection=e.target.value.slice(0,1500);save()}if(e.target.id==='note-draft'){state.draft=e.target.value.slice(0,450);save()}});
home();
})();
</script></body></html>
