isplay:grid;gap:12px;margin:15px 0}.option{display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);padding:17px;border-radius:10px;background:white}.option:has(input:checked){border:2px solid var(--slate);background:var(--blue-pale);padding:16px}.option strong{display:block;margin-bottom:5px}.option .small{display:block}.flag{display:flex;gap:10px;align-items:flex-start;min-height:42px;margin:8px 0}.flag input{margin-top:4px}.help-list{margin:7px 0 8px;padding-left:20px}.help-list li{margin:6px 0}.write-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.insight-preview{padding:17px 19px;background:#fff7f8;border:1px solid #E7C4CB;border-left:5px solid var(--red);border-radius:9px;margin-top:15px}.insight-preview p{margin-bottom:5px}.module-actions{border-top:1px solid var(--line);padding-top:24px;margin-top:30px;display:flex;align-items:center;gap:11px;justify-content:space-between;flex-wrap:wrap}.idea-card{border:1px solid var(--line);padding:16px;border-radius:10px;background:#fff}.idea-card .row{justify-content:space-between}.idea-text{white-space:pre-wrap;margin:9px 0}.tag{font-size:.76rem;font-weight:800;color:var(--slate)}.technique{border:1px solid var(--line);background:#fff;padding:14px;min-height:76px;border-radius:10px;text-align:left;width:100%;color:var(--ink)}.technique[aria-pressed="true"]{border:2px solid var(--red);background:#fff7f8;color:var(--red-dark)}.technique strong,.technique small{display:block}.technique small{color:#575a5d;font-weight:400;margin-top:5px}.constraint{border:1px solid #D6C293;background:#FFF9E9;border-radius:9px;padding:16px;margin:15px 0}.rating-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.rating-grid label{font-weight:700;font-size:.86rem;display:block}.rating-grid select{margin-top:5px}.score{font:800 1.18rem Arial,sans-serif;color:var(--slate);white-space:nowrap}.ranked{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--cream);border-radius:9px;padding:13px 15px;margin:9px 0}.proto-step{border:1px solid var(--line);border-radius:10px;padding:18px;margin:13px 0;background:white}.proto-step .count{background:var(--pale);border-radius:7px;padding:5px 10px;font-weight:800;color:#414141}.proto-step .fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:8px}.proto-step .field{margin:6px 0}.proto-preview{border-left:4px solid var(--red);background:#fff7f8;padding:18px;border-radius:8px;margin:13px 0}.proto-preview .small{white-space:pre-wrap}.testing-metric{border:1px solid var(--line);border-radius:9px;background:var(--cream);padding:16px}.testing-metric strong{font-size:1.25rem;display:block}.mode-note{border:1px solid var(--line);border-left:5px solid var(--slate);background:#f7f9fa;border-radius:8px;padding:15px;margin:13px 0}details{margin:17px 0}summary{cursor:pointer;font-weight:700;padding:10px 4px}details .details-content{padding:8px 16px 19px;border:1px solid var(--line);background:var(--cream);border-radius:9px}.footer{max-width:1250px;margin:0 auto;padding:2px 26px 36px;color:var(--muted);font-size:.83rem}.footer .divider{border-top:1px solid var(--line);padding-top:17px;margin-top:25px}.count{font-variant-numeric:tabular-nums}.feedback:focus,.notice:focus{outline:3px solid var(--slate)}

<script>(()=>{'use strict';
const STANDALONE_STAGE=3;
const STAGES=[{id:'frame',title:'Problem framing',desc:'Interpret your interview evidence before choosing a solution.'},{id:'ideate',title:'Idea generation',desc:'Create many possible responses using multiple creative techniques.'},{id:'select',title:'Idea selection',desc:'Compare alternatives, tradeoffs, and assumptions.'},{id:'prototype',title:'Rapid prototyping',desc:'Make a simple service journey that users can try.'},{id:'test',title:'Test & iterate',desc:'Observe a simulated user, interpret results, and improve.'}];
const CASES={
 campus:{id:'campus',title:'Campus events',persona:'Jordan',personaDesc:'a commuter student balancing classes, travel, work, and connections',subtitle:'A student decides whether to attend campus events.',context:'Jordan commutes to campus, sometimes attends events, and sometimes leaves immediately after class. The interview explored what actually shapes the decision—not simply whether Jordan likes events.',question:'How can campus events feel realistically possible and worthwhile for students who commute?',source:'Simulated interview with Jordan, a commuter student',signals:[{id:'discovery',label:'Find reliable details',need:'Clear event information that can be trusted',test:'Jordan sees one clear source for accurate event details.',reaction:'I found something interesting, but I still do not know where the accurate details are.'},{id:'timing',label:'Fit time and travel',need:'Predictable timing and travel expectations',test:'Jordan can judge the schedule and travel impact before deciding.',reaction:'I cannot tell whether I can fit this between class and my ride home.'},{id:'belonging',label:'Feel comfortable joining',need:'Knowing what the experience and social setting will be like',test:'Jordan knows what to expect and whether coming alone is comfortable.',reaction:'It sounds good, but I cannot tell what it would be like to show up by myself.'},{id:'arrival',label:'Know what happens next',need:'A clear place to go and a next step on arrival',test:'Jordan knows exactly where to go and what to do.',reaction:'I decided to come, but I am not sure where I should start.'}],notes:[{id:'C1',source:'Jordan · interview',kind:'evidence',text:'“My last class ends around two. Sometimes the event does not start until much later.”',signal:'timing',why:'A first-person report of a specific scheduling barrier.'},{id:'C2',source:'Jordan · interview',kind:'evidence',text:'“I stayed for a workshop when a friend told me what it was like and met me there.”',signal:'belonging',why:'A specific exception helps test whether low interest explains everything.'},{id:'C3',source:'Event flyer · observation',kind:'evidence',text:'The flyer lists a title, date, and start time, but not the expected length or what participants will do.',signal:'discovery',why:'An observable feature of the event information.'},{id:'C4',source:'Team discussion',kind:'assumption',text:'Commuter students do not attend because they do not care about campus life.',signal:'belonging',why:'A broad causal explanation without adequate supporting research.'},{id:'C5',source:'Interview follow-up',kind:'question',text:'Would Jordan attend an event during a break between classes without a friend going?',signal:'timing',why:'This is an unanswered question that can guide additional inquiry.'},{id:'C6',source:'Jordan · interview',kind:'evidence',text:'“I saw three different announcements. I could not tell if the location changed.”',signal:'discovery',why:'A user-reported difficulty with information reliability.'},{id:'C7',source:'Team discussion',kind:'assumption',text:'A new event app would solve the attendance problem.',signal:'discovery',why:'A proposed solution and causal claim, not research evidence.'},{id:'C8',source:'Jordan · interview',kind:'evidence',text:'“If I know where to go and what people will actually do, I am more likely to consider it.”',signal:'arrival',why:'A direct statement linking expectations to a decision.'}],frames:[{id:'interest',title:'Students are simply uninterested in campus activities.',description:'The problem is lack of interest. Promote events more aggressively.',quality:'weak',why:'This overgeneralizes from attendance outcomes and disregards Jordan’s exceptions and practical constraints.'},{id:'human',title:'Commuters need enough clarity to judge whether an event fits their lives.',description:'The challenge involves reliable details, timing, expectations, and confidence about showing up.',quality:'strong',why:'This connects a particular stakeholder to evidenced needs without prescribing a solution.'},{id:'app',title:'Campus needs an app to improve attendance.',description:'Build a central app and the problem will be solved.',quality:'weak',why:'This jumps to one delivery mechanism before the underlying need is fully understood.'}],surprise:'In a follow-up, Jordan explains that a short event between classes would be manageable—but only if they could see what participation involves. Timing alone does not fully explain the decision.',techniques:{reverse:'How could we make an event especially confusing or inconvenient for a commuter? Reverse those conditions into opportunities.',analogy:'Imagine an event invite worked like a reliable train schedule or a clear movie listing. What would students know before committing?',scamper:'What could you combine, simplify, eliminate, or reorder in the event-discovery and arrival journey?'},wildcards:['You cannot add any new staff time.','The solution must work without installing a new app.','A student has only a 40-minute gap between classes.'],seeds:['One clear event card showing length, location, and what participants actually do','A “come alone or with friends” arrival preview for each event','A commuter-friendly event finder showing time needed, not just start time','An arrival sign and welcome point using existing resources'],protoSeed:[{title:'Discover a relevant event',detail:'Show a concise description with duration and an accurate location.',need:'discovery'},{title:'Decide if it fits',detail:'Make timing and travel implications easy to assess.',need:'timing'},{title:'Arrive with confidence',detail:'Show exactly where to go and what to expect on arrival.',need:'arrival'}],testTask:'Jordan finds an appealing campus event and decides whether to attend without help.',nudge:'An event location changes 30 minutes before the start. Can Jordan still make an informed decision?'},
 pickup:{id:'pickup',title:'Customer pickup experience',persona:'Elena',personaDesc:'a first-time online-order pickup customer at Riverbend Home & Garden',subtitle:'A customer collects an online order at Riverbend Home & Garden.',context:'Elena placed an online order for pickup at Riverbend Home & Garden. Parts of the process were convenient, but she was not always confident about where to go, how to wait, or whether the handoff was complete.',question:'How can a first-time pickup customer complete an order with confidence?',source:'Simulated interview with Elena, an online-order pickup customer',signals:[{id:'wayfinding',label:'Find the right location',need:'Clear directions from arrival to pickup point',test:'Elena knows where to park and where to walk.',reaction:'I have arrived, but I cannot tell whether this is pickup or customer returns.'},{id:'queue',label:'Know how to join the process',need:'A clear check-in or queueing process',test:'Elena knows how to check in without guessing.',reaction:'There are two lines. I do not know which one I should join.'},{id:'status',label:'Understand waiting status',need:'Predictable waiting and meaningful updates',test:'Elena knows what happens while the order is located.',reaction:'I am waiting, but I have no idea whether anyone knows I am here.'},{id:'confirmation',label:'Verify a complete handoff',need:'Clear confirmation that the correct, complete order was received',test:'Elena can verify the items and knows pickup is complete.',reaction:'I have the bag, but how do I know this is the complete order?'}],notes:[{id:'R1',source:'Elena · interview',kind:'evidence',text:'“I found the parking lot easily, but could not tell whether pickup was at the returns desk.”',signal:'wayfinding',why:'A specific account of arrival and wayfinding.'},{id:'R2',source:'Elena · interview',kind:'evidence',text:'“There were two lines. I was not sure which was for online orders.”',signal:'queue',why:'A direct report of uncertainty about queueing.'},{id:'R3',source:'Elena · interview',kind:'evidence',text:'“The order was ready quickly, but I still did not know if I had everything.”',signal:'confirmation',why:'Contrasts speed with incomplete handoff confidence.'},{id:'R4',source:'Team discussion',kind:'assumption',text:'Customers dislike pickup because the staff are too slow.',signal:'status',why:'A generalized cause that conflicts with Elena’s reported experience.'},{id:'R5',source:'Interview follow-up',kind:'question',text:'Would a clear check-in sign and item confirmation resolve Elena’s uncertainty?',signal:'confirmation',why:'A proposed explanation that has not been tested.'},{id:'R6',source:'Store observation',kind:'evidence',text:'The pickup and returns signs share a similar color and are visible from the same entrance.',signal:'wayfinding',why:'An observable characteristic of the service environment.'},{id:'R7',source:'Team discussion',kind:'assumption',text:'Customers will use a new mobile app to track every pickup.',signal:'status',why:'A forecast of customer behavior, not demonstrated research.'},{id:'R8',source:'Elena · interview',kind:'evidence',text:'“I wanted someone to say the order was complete and tell me what to do if an item was missing.”',signal:'confirmation',why:'A first-person description of the missing reassurance.'}],frames:[{id:'slow',title:'Pickup staff need to work faster.',description:'Speed alone explains the customer’s frustration.',quality:'weak',why:'Elena described prompt service but uncertainty. This frame privileges an untested operational explanation.'},{id:'human',title:'First-time customers need clear cues through arrival, waiting, and handoff.',description:'The underlying challenge is knowing where to go, what happens next, and when pickup is complete.',quality:'strong',why:'This frames a user need, supported by several observations, without locking in a technology solution.'},{id:'lockers',title:'The store should install automated lockers.',description:'Solve the experience by replacing the staffed handoff.',quality:'weak',why:'This assumes a particular expensive solution before validating the cause of the confusion.'}],surprise:'Elena says the actual wait was short. A friend who used pickup many times found the process easy, but Elena still worried about missing items after handoff. The issue may be first-time clarity, not simply speed.',techniques:{reverse:'How could a store make online pickup as confusing as possible? Reverse each failure into a helpful customer cue.',analogy:'Imagine pickup worked like an airport baggage claim with clear zones and confirmations. What principles transfer—and which do not?',scamper:'What could Riverbend combine, remove, reorder, or simplify in arrival, queueing, and order handoff?'},wildcards:['No additional pickup employees can be hired.','Customers must be able to use the solution without a smartphone.','The store cannot change the parking-lot layout.'],seeds:['Arrival signs separating returns from online pickup','A visible check-in step and simple waiting-state cue','A short order-verification checklist at handoff','A pickup instruction card designed for first-time customers'],protoSeed:[{title:'Find the pickup point',detail:'Give clear arrival directions that distinguish pickup from returns.',need:'wayfinding'},{title:'Check in clearly',detail:'Show where and how to enter the pickup queue.',need:'queue'},{title:'Verify the handoff',detail:'Confirm items and explain what to do if something is missing.',need:'confirmation'}],testTask:'Elena arrives to collect an online order and completes the pickup without guidance.',nudge:'The order contains two packages, but only one is initially handed to Elena. Does the process surface the issue?'}
};
const app=document.getElementById('app'),live=document.getElementById('live-status');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wc=s=>(String(s||'').trim().match(/\S+/g)||[]).length;
const uid=()=>('x'+Math.random().toString(36).slice(2,10));
const stateKey=id=>'dt_learning_labs_v1_'+id;

function loadState(id){try{const raw=localStorage.getItem(stateKey(id));if(raw){const data=JSON.parse(raw);if(data&&data.version===1&&data.caseId===id&&data.interview&&data.ideation&&data.selection&&data.prototype&&data.testing&&Array.isArray(data.prototype.steps)){return data}}}catch(e){}return defaultState(id)}
function save(){if(!state)return;try{localStorage.setItem(stateKey(state.caseId),JSON.stringify(state))}catch(e){announce('Could not save in this browser. Use Export progress to keep a copy.')}}

function setPath(path,val){const p=path.split('.');let obj=state;for(let i=0;i<p.length-1;i++){obj=obj[p[i]]}obj[p[p.length-1]]=val;save()}
function selectedFrame(){return C().frames.find(f=>f.id===state.interview.frame)}
function itemById(id){return [...state.ideation.ideas,...C().seeds.map((text,i)=>({id:'seed'+i,text,technique:'Suggested starter'}))].find(x=>x.id===id)}
function currentIdeas(){return [...state.ideation.ideas,...C().seeds.map((text,i)=>({id:'seed'+i,text,technique:'Suggested starter'}))]}
function protoSignature(){return state.prototype.steps.map(s=>[s.title,s.detail,s.need].join('|')).join('||')}
const getHashStage=()=>0;
const coachText={1:['Interview quotations are data; explanations about why something happens often remain assumptions.','Look for an exception that complicates your first interpretation.','A strong “How might we” question opens possibilities rather than naming an app or other solution.'],2:['Generate alternatives before deciding what to build.','Reverse a bad experience, borrow an analogy, then simplify or combine steps.','A constraint can reveal new creative opportunities.'],3:['A score helps structure discussion; it is not proof that one concept is objectively best.','Give accessibility a real voice alongside feasibility.','Write the most important assumption that must be tested next.'],4:['A prototype is a question made tangible, not a polished final product.','Keep the sequence simple enough for a person to try without coaching.','Move steps with the Move up/Move down buttons: drag-and-drop is not required.'],5:['Watch behavior before asking whether the person likes the design.','Do not mistake simulated feedback for real user testing.','Change something specific, test again, and compare the two rounds.']};

function renderHome(shouldFocus=false){const ids=['campus','pickup'];app.innerHTML=`<main id="main" tabindex="-1"><section class="panel hero"><p class="eyebrow">Design Thinking Learning Lab · Lab ${STANDALONE_STAGE+1} of 6</p><h1 id="main-heading" tabindex="-1">${esc(STAGES[STANDALONE_STAGE-1].title)}</h1><p class="lede">${esc(STAGES[STANDALONE_STAGE-1].desc)}</p><p>Choose a case. You can start with the sample information or import a progress file from an earlier learning lab. Your work in this lab can be downloaded for the next Canvas module.</p></section><div class="grid two" style="margin-top:20px">${ids.map(id=>{const s=loadState(id),c=CASES[id];return `<section class="panel case-card"><span class="chip blue">${esc(c.persona)} · ${esc(id==='campus'?'Campus events':'Customer pickup')}</span><h2>${esc(c.title)}</h2><p>${esc(c.subtitle)} Continue with the same case through the learning sequence.</p><p class="small">${s.completed[STANDALONE_STAGE]?'This lab has been marked complete on this device.':'Not yet marked complete on this device.'}</p><div class="row"><button class="btn primary" type="button" data-act="start" data-case="${id}">${s.completed[STANDALONE_STAGE]?'Continue this lab':'Start this lab'}</button><button class="btn quiet sm" type="button" data-act="reset-case" data-case="${id}">Start over</button></div></section>`}).join('')}</div><section class="panel" style="padding:22px;margin-top:20px"><h2 style="font-size:1.45rem">Moving between course modules</h2><ol><li>Choose the same case as in your previous simulation.</li><li>Use <strong>Import progress</strong> to load a JSON file from the earlier lab (or use the provided sample case).</li><li>Complete the practice and use <strong>Export progress</strong> before leaving.</li></ol><p class="small">Every HTML file runs on its own, without a login, internet access, or shared files. Because Canvas may isolate browser storage, exported JSON files are the reliable way to move work between labs. No personal information is required.</p></section></main>`;if(shouldFocus)app.querySelector('#main-heading')?.focus({preventScroll:true})}
function renderWorkspace(){const c=C(),s=STAGES[STANDALONE_STAGE-1];return `<div class="row between"><button class="btn outline sm" type="button" data-act="home">← Change scenario</button><span class="chip">${esc(c.persona)} · ${esc(c.title)}</span></div><div class="stage-shell"><main id="main" class="panel stage-panel" tabindex="-1"><header class="stage-title"><div class="stage-strap"><span class="chip red">Lab ${STANDALONE_STAGE+1} of 6</span><span class="chip ${state.completed[STANDALONE_STAGE]?'green':'blue'}">${state.completed[STANDALONE_STAGE]?'Marked complete':'Practice activity'}</span></div><h1 tabindex="-1" id="main-heading">${esc(s.title)}</h1><p>${esc(s.desc)}</p><div class="file-bridge"><strong>Carry work between labs</strong><p class="small">Import an earlier lab's JSON progress, or export this lab's work before leaving. Choose the same scenario across modules.</p><div class="row"><button class="btn outline sm" type="button" data-act="import-progress">Import progress</button><button class="btn quiet sm" type="button" data-act="export-json">Export progress</button></div></div></header><div class="case-strip"><strong>${esc(c.persona)}: ${esc(c.subtitle)}</strong><p class="small">${esc(c.context)}</p></div>${[renderFrame,renderIdeate,renderSelect,renderPrototype,renderTest][STANDALONE_STAGE-1]()}${moduleActions()}</main><aside class="panel coach" aria-labelledby="coach-heading"><p class="eyebrow">Learning coach</p><h2 id="coach-heading">Questions to keep in mind</h2><ul>${coachText[STANDALONE_STAGE].map(x=>`<li>${esc(x)}</li>`).join('')}</ul><details><summary>About this simulation</summary><p class="small">${esc(c.persona)} and these research cases are fictional teaching examples. They are for learning how to reason about evidence—not a claim of real user validation.</p></details><hr><div class="row"><button class="btn quiet sm" type="button" data-act="export-json">Export progress</button><button class="btn quiet sm" type="button" data-act="import-progress">Import progress</button><button class="btn quiet sm" type="button" data-act="export-artifact">Learning artifact</button></div><input class="sr-only" id="progress-file" type="file" accept=".json,application/json" aria-label="Select an exported learning lab progress JSON" tabindex="-1"></aside></div>`}
function moduleActions(){return `<div class="module-actions"><div class="row"><button class="btn quiet" type="button" data-act="review">Review my work</button><button class="btn quiet" type="button" data-act="export-artifact">Download learning artifact</button></div><button class="btn primary" type="button" data-act="complete">${state.completed[STANDALONE_STAGE]?'Review completion':'Mark this lab complete'}</button></div><div id="review-feedback" aria-live="polite"></div>`}
function heading(n,title){return `<div class="section-heading"><span class="step-number" aria-hidden="true">${n}</span><h2>${esc(title)}</h2></div>`}
function field(path,title,value,opts={}){const id='field-'+path.replaceAll('.','-');const tag=opts.multiline===false?'input':'textarea';return `<div class="field"><label for="${id}">${esc(title)}</label>${tag==='textarea'?`<textarea id="${id}" data-field="${path}" rows="${opts.rows||3}" ${opts.max?`maxlength="${opts.max}"`:''} aria-describedby="${id}-help">${esc(value)}</textarea>`:`<input id="${id}" type="text" data-field="${path}" value="${esc(value)}" ${opts.max?`maxlength="${opts.max}"`:''} aria-describedby="${id}-help">`}<small id="${id}-help">${esc(opts.help||'Use your own words and cite evidence where possible.')}</small></div>`}
function renderFrame(){const i=state.interview,c=C(),notes=activeNotes(),num=notes.filter(n=>i.classification[n.id]).length;return `<section class="section first" id="interview-bridge">${heading(1,'Bring forward your interview evidence')}<p>Use what you learned in the Interview Simulator. The sample evidence below is available for practice; you can also add findings from your own interview with ${esc(c.persona)}.</p><details><summary>Import or paste my Interview Simulator notes</summary><div class="details-content"><p class="small">Paste field notes, or select a <strong>.txt, .md, .html, or .json</strong> report from the Interview Simulator. Text stays on your device. Review extracted findings carefully: not every line in a report is evidence.</p>${field('interview.raw','Interview report or field notes',i.raw,{rows:5,help:'Paste the report text. To turn individual lines into evidence cards, choose Extract notes.'})}<div class="field"><label for="interview-file">Choose an exported interview file</label><input id="interview-file" type="file" accept=".txt,.md,.html,.htm,.json,text/plain,text/html,application/json"><small>The file is read only in this browser and is not uploaded.</small></div><button class="btn outline" type="button" data-act="extract-notes">Extract possible findings</button><p class="small">The extraction creates up to 10 editable research notes. Remove questions, interface text, or unsupported interpretations that should not count as evidence.</p></div></details><div class="field"><label for="new-note">Add one finding from your interview</label><textarea id="new-note" data-field="interview.draftNote" rows="2" aria-describedby="new-note-help">${esc(i.draftNote)}</textarea><small id="new-note-help">Include a quote or observed behavior and, if possible, its context. Do not record identifying personal information.</small></div><button class="btn outline sm" type="button" data-act="add-note">Add interview finding</button><p class="small">${i.customNotes.length} student-added finding${i.customNotes.length===1?'':'s'} · ${c.notes.length} simulated research notes</p></section>
<section class="section" id="audit">${heading(2,'Separate evidence, assumptions, and unanswered questions')}<p>Classify each note, then choose the <strong>supporting</strong> and <strong>complicating</strong> observations you would carry into a problem statement. An exception is especially useful.</p><p class="small">Classified ${num} of ${notes.length} notes. Supporting: ${i.support.length}. Complicating: ${i.counter.length}.</p><div class="evidence-grid">${notes.map(n=>{const sel=i.classification[n.id];const isSample=!!n.kind;const right=sel===n.kind;return `<article class="evidence-card" id="note-${esc(n.id)}"><div class="meta"><strong>${esc(n.id)}</strong><span class="source">${esc(n.source)}</span></div><p>${esc(n.text)}</p>${!isSample?`<div class="field"><label for="edit-${esc(n.id)}">Edit interview finding ${esc(n.id)}</label><textarea id="edit-${esc(n.id)}" data-edit-note="${esc(n.id)}" rows="2" maxlength="450">${esc(n.text)}</textarea></div>`:''}<div class="segmented" role="group" aria-label="Classify note ${esc(n.id)}"><button type="button" class="choice" data-act="classify" data-note="${esc(n.id)}" data-kind="evidence" aria-label="Note ${esc(n.id)}: evidence" aria-pressed="${sel==='evidence'}">Evidence</button><button type="button" class="choice" data-act="classify" data-note="${esc(n.id)}" data-kind="assumption" aria-label="Note ${esc(n.id)}: assumption" aria-pressed="${sel==='assumption'}">Assumption</button><button type="button" class="choice" data-act="classify" data-note="${esc(n.id)}" data-kind="question" aria-label="Note ${esc(n.id)}: question" aria-pressed="${sel==='question'}">Question</button></div><div class="row" style="margin-top:11px"><button type="button" class="btn quiet sm" data-act="evidence-role" data-role="support" data-note="${esc(n.id)}" aria-label="Note ${esc(n.id)}: mark supporting" aria-pressed="${i.support.includes(n.id)}">${i.support.includes(n.id)?'✓ Supporting':'Mark supporting'}</button><button type="button" class="btn quiet sm" data-act="evidence-role" data-role="counter" data-note="${esc(n.id)}" aria-label="Note ${esc(n.id)}: mark complicating" aria-pressed="${i.counter.includes(n.id)}">${i.counter.includes(n.id)?'✓ Complicating':'Mark complicating'}</button>${!isSample?`<button type="button" class="btn danger sm" data-act="delete-note" data-note="${esc(n.id)}" aria-label="Remove student-added note ${esc(n.id)}">Remove</button>`:''}</div>${i.showFeedback&&sel?`<div class="evidence-response ${isSample?(right?'ok':'caution'):''}"><strong>${isSample?(right?'Aligned with the research type':'Reconsider this classification'):'Your classification'}</strong><div>${esc(isSample?n.why:'Check whether you directly observed this, inferred it, or still need to ask.')}</div></div>`:''}</article>`}).join('')}</div><div class="row" style="margin-top:16px"><button class="btn outline" type="button" data-act="audit-feedback">Check classifications</button><span class="small">For your own notes, you decide and justify the classification.</span></div></section>
<section class="section" id="framing">${heading(3,'Choose and explain the problem frame')}<p>Which preliminary interpretation follows the evidence most carefully? Alternatives deliberately include assumptions and solution-first thinking.</p><fieldset style="border:0;margin:0;padding:0"><legend class="sr-only">Select a preliminary problem frame</legend><div class="option-list">${c.frames.map(f=>`<label class="option"><input type="radio" name="frame-choice" value="${f.id}" data-radio="interview.frame" ${i.frame===f.id?'checked':''}><span><strong>${esc(f.title)}</strong><span class="small">${esc(f.description)}</span></span></label>`).join('')}</div></fieldset>${i.frame?`<div class="feedback" id="frame-feedback"><h3>Coach's interpretation</h3><p>${esc(selectedFrame().why)}</p><p class="small">A different frame can be justified if you can point to credible evidence. This activity asks for reasoning, not only a preferred choice.</p></div>`:''}${field('interview.povNeed',`${c.persona} needs…`,i.povNeed,{help:'Describe a human need, not a feature or technology.'})}${field('interview.povInsight','Because the interview suggests…',i.povInsight,{help:'Connect the need to two or more observations, including an exception if possible.'})}${field('interview.hmw','How might we…?',i.hmw,{help:'Open up possible solutions without naming a specific technology or preferred fix.'})}</section>
<section class="section" id="surprise">${heading(4,'Respond when new evidence complicates your frame')}<div class="notice"><strong>New interview follow-up</strong><p>${esc(c.surprise)}</p></div>${field('interview.revision','Revise your How Might We question',i.revision,{help:'Revise the scope or wording to reflect this additional evidence.'})}${field('interview.revisionReason','What changed in your understanding?',i.revisionReason,{help:'Explain which assumption weakened or which need became clearer.'})}${i.reviewed?`<div class="feedback" id="frame-summary"><h3>Framing review</h3>${feedbackList(frameChecks()).map(x=>x).join('')}</div>`:''}</section>`}
function feedbackList(checks){return checks.map(x=>`<p><strong>${x.ok?'✓':'Consider:'}</strong> ${esc(x.msg)}</p>`)}
function frameChecks(){const i=state.interview,c=C(),notes=activeNotes();const cls=c.notes.filter(n=>i.classification[n.id]);const correct=cls.filter(n=>i.classification[n.id]===n.kind).length;return [{ok:notes.filter(n=>i.classification[n.id]).length>=4,msg:`Classified ${notes.filter(n=>i.classification[n.id]).length} of ${notes.length} notes. Of the simulated notes you classified, ${correct} match the source distinction. Aim to classify at least four.`},{ok:i.support.length>=2&&i.counter.length>=1,msg:`Selected ${i.support.length} supporting and ${i.counter.length} complicating notes; aim for at least two supports and one complication.`},{ok:i.support.every(x=>notes.find(n=>n.id===x)?.kind!=='assumption'),msg:'Avoid treating an untested explanation as established supporting evidence.'},{ok:!!i.frame&&selectedFrame()?.quality==='strong',msg:i.frame?'Check that your framing describes a stakeholder need without prescribing the solution.':'Choose a preliminary interpretation of the problem.'},{ok:wc(i.povNeed)>=5&&wc(i.povInsight)>=7,msg:'Write a specific stakeholder need and an insight supported by research.'},{ok:/^\s*how might we\b/i.test(i.hmw)&&wc(i.hmw)>=7,msg:'Begin your initial question with “How might we” and leave room for multiple solutions.'},{ok:/^\s*how might we\b/i.test(i.revision)&&wc(i.revision)>=7&&wc(i.revisionReason)>=8,msg:'Revise your question in light of the new finding, and explain why it changed.'}]}
function renderIdeate(){const a=state.ideation,c=C(),techs=[['reverse','Reverse thinking','Identify what makes an experience go wrong.'],['analogy','Borrow an analogy','Transfer a principle from another experience.'],['scamper','SCAMPER','Substitute, combine, adapt, modify, put to another use, eliminate, reverse.']];return `<section class="section first">${heading(1,'Generate ideas before judging them')}<p><strong>Working challenge:</strong> ${esc(state.interview.revision||state.interview.hmw||c.question)}</p><p class="small">Choose a thinking technique. Produce ideas that respond to the problem, not just ideas that sound exciting.</p><div class="grid three">${techs.map(t=>`<button type="button" class="technique" data-act="technique" data-technique="${t[0]}" aria-pressed="${a.technique===t[0]}"><strong>${esc(t[1])}</strong><small>${esc(t[2])}</small></button>`).join('')}</div><div class="subtle" role="region" aria-label="Creative prompt"><strong>${esc(techs.find(t=>t[0]===a.technique)[1])} prompt</strong><p>${esc(c.techniques[a.technique])}</p></div><div class="field"><label for="idea-draft">One possible idea</label><textarea id="idea-draft" data-field="ideation.draftIdea" rows="3" aria-describedby="idea-hint">${esc(a.draftIdea)}</textarea><small id="idea-hint">Describe a new way to help ${esc(c.persona)}. A rough idea is welcome.</small></div><button class="btn primary" type="button" data-act="add-idea">Add idea to idea bank</button></section>
<section class="section">${heading(2,'Explore your idea bank')}<p class="small">${a.ideas.length} ideas · ${new Set(a.ideas.map(x=>x.technique)).size} thinking techniques represented. Aim for at least three ideas across two techniques before selecting a concept.</p><div class="grid two">${a.ideas.map((x,i)=>`<article class="idea-card"><div class="row"><span class="chip blue">Idea ${i+1}</span><button class="btn quiet sm" data-act="delete-idea" data-id="${esc(x.id)}" type="button" aria-label="Remove idea ${i+1}">Remove</button></div><div class="idea-text">${esc(x.text)}</div><span class="tag">Technique: ${esc(x.technique)}</span></article>`).join('')||`<div class="subtle"><strong>No ideas yet</strong>Start with the creative prompt above. Your ideas will appear here.</div>`}</div><details ${a.showInspiration?'open':''}><summary>Optional inspiration (show sample ideas)</summary><div class="details-content"><p class="small">These are starting points, not model answers. Try to produce your own alternatives first.</p><ul class="help-list">${c.seeds.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></details></section>
<section class="section">${heading(3,'Adapt an idea under a new constraint')}<p>Real-world limits are part of creative work. Reveal a constraint, then change one of your ideas rather than discarding the challenge.</p><button class="btn outline" type="button" data-act="wildcard">${a.wildcardIndex<0?'Reveal a constraint':'Try another constraint'}</button>${a.wildcardIndex>=0?`<div class="constraint"><strong>New constraint</strong><p>${esc(c.wildcards[a.wildcardIndex])}</p></div>`:''}${field('ideation.adaptation','How would you adapt an existing idea?',a.adaptation,{help:'Name the idea and describe what changes. Consider the person’s needs, not just the restriction.'})}</section>`}
function ideateChecks(){const a=state.ideation;return [{ok:a.ideas.length>=3,msg:`Generate at least three ideas. Currently: ${a.ideas.length}.`},{ok:new Set(a.ideas.map(x=>x.technique)).size>=2,msg:'Use at least two different techniques to avoid settling too quickly.'},{ok:a.wildcardIndex>=0&&wc(a.adaptation)>=10,msg:'Reveal a new constraint and explain how one idea would adapt (at least 10 words).'}]}
function selectionPool(){return currentIdeas()}
function scoreRatings(r){return ['need','feasibility','access','testability'].reduce((a,k)=>a+(Number(r?.[k])||0),0)}
function rated(id){const r=state.selection.ratings[id];return !!r&&['need','feasibility','access','testability'].every(k=>Number(r[k])>=1)}
function renderSelect(){const s=state.selection,ideas=selectionPool(),chosen=s.choice?itemById(s.choice):null,ratings=[['need','User need','Does this respond to interview evidence?'],['feasibility','Feasibility','Can it work within reasonable constraints?'],['access','Accessibility & inclusion','Can people with different needs use it?'],['testability','Testability','Can we learn from a low-cost prototype?']];const candidates=ideas.filter(x=>s.candidates.includes(x.id));const sorted=candidates.filter(x=>rated(x.id)).map(x=>({idea:x,score:scoreRatings(s.ratings[x.id])})).sort((a,b)=>b.score-a.score);return `<section class="section first">${heading(1,'Select concepts worth comparing')}<p>Choose two or three ideas. Your own brainstormed ideas appear alongside <strong>suggested starters</strong> that can be used if you enter this lab directly.</p><div class="option-list">${ideas.map(x=>`<label class="option"><input type="checkbox" data-candidate="${esc(x.id)}" ${s.candidates.includes(x.id)?'checked':''}><span><strong>${esc(x.text)}</strong><span class="small">${esc(x.technique==='Suggested starter'?'Suggested starter':'Your idea · '+x.technique)}</span></span></label>`).join('')}</div><p class="small">${s.candidates.length} selected (maximum 3). Choose at least two to compare.</p></section>
<section class="section">${heading(2,'Rate each idea against four criteria')}<p>Use a 1–5 scale (1 = weak, 5 = strong). The 20-point total structures your reasoning; it is <strong>not</strong> an automatic decision or a validated forecast.</p><div class="grid two">${candidates.map((x,i)=>{const r=s.ratings[x.id]||{};return `<article class="idea-card"><div class="row between"><strong>${esc(x.text)}</strong><span class="score">${rated(x.id)?scoreRatings(r)+'/20':'Not rated'}</span></div><div class="rating-grid" style="margin-top:14px">${ratings.map((pair)=>`<label>${esc(pair[1])}<select data-rating="${esc(x.id)}" data-criterion="${pair[0]}" aria-label="${esc(pair[1])} rating for idea ${i+1}"><option value="">Choose 1–5</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(r[pair[0]])===n?'selected':''}>${n} / 5</option>`).join('')}</select><span class="micro">${esc(pair[2])}</span></label>`).join('')}</div></article>`}).join('')||`<div class="subtle">Choose two ideas above to see the rating controls.</div>`}</div>${sorted.length?`<div class="subtle"><strong>Score comparison (rated ideas only)</strong>${sorted.map(x=>`<div class="ranked"><span>${esc(x.idea.text)}</span><span class="score">${x.score}/20</span></div>`).join('')}<p class="small">Different scores are a discussion aid, not a requirement to select the highest-scoring idea.</p></div>`:''}</section>
<section class="section">${heading(3,'Choose deliberately and name the risks')}<p>Pick one of the ideas you rated. Explain why the evidence supports it and acknowledge what remains uncertain.</p><fieldset style="border:0;padding:0;margin:0"><legend class="label">Concept to prototype</legend><div class="option-list">${candidates.map((x)=>`<label class="option"><input type="radio" name="chosen-idea" data-radio="selection.choice" value="${esc(x.id)}" ${s.choice===x.id?'checked':''}><span>${esc(x.text)}${!rated(x.id)?'<span class="small"> · Rate this idea above before finishing.</span>':''}</span></label>`).join('')}</div></fieldset>${field('selection.rationale','Why does this idea deserve a prototype?',s.rationale,{help:'Point to specific observations and describe how this concept helps the person.'})}${field('selection.assumption','What important assumption could be wrong?',s.assumption,{help:'For example, assume students will check an event card or customers will understand a sign.'})}${field('selection.tradeoff','What is the biggest tradeoff?',s.tradeoff,{help:'Think about accessibility, workload, cost, equity, or another stakeholder.'})}${s.reviewed?`<div class="feedback"><h3>Decision review</h3>${feedbackList(selectionChecks()).join('')}</div>`:''}</section>`}
function selectionChecks(){const s=state.selection;return [{ok:s.candidates.length>=2,msg:'Select at least two alternatives for comparison.'},{ok:s.candidates.filter(x=>rated(x)).length>=2,msg:'Rate at least two alternatives on all four criteria.'},{ok:!!s.choice&&s.candidates.includes(s.choice)&&rated(s.choice),msg:'Choose a rated concept to prototype.'},{ok:wc(s.rationale)>=12,msg:'Justify the decision using the evidence (at least 12 words).'}, {ok:wc(s.assumption)>=7,msg:'Name one specific assumption to test (at least 7 words).'}, {ok:wc(s.tradeoff)>=6,msg:'Recognize at least one meaningful tradeoff (at least 6 words).'}]}
function renderPrototype(){const p=state.prototype,c=C(),chosen=state.selection.choice?itemById(state.selection.choice):null;return `<section class="section first">${heading(1,'Choose what the prototype must help you learn')}<p>Model a simple <strong>service journey</strong>: the important moments ${esc(c.persona)} would experience, in order. This is deliberately low fidelity, so the focus stays on what you want to test.</p><div class="subtle"><strong>Concept carried forward</strong><p>${esc(chosen?.text||'No idea selected yet. You may still practice prototyping with the starter steps below.')}</p><strong>Most important untested assumption</strong><p>${esc(state.selection.assumption||'What do you expect the user to understand or do?')}</p></div>${field('prototype.goal','What should this prototype demonstrate?',p.goal,{help:'For example, help the person find the correct next step without assistance.'})}${field('prototype.testQuestion','What one question should the test answer?',p.testQuestion,{help:'Ask about observable behavior, such as whether they can find the pickup desk.'})}</section>
<section class="section">${heading(2,'Build the service journey')}<p>Start with three editable touchpoints, then change the text, need addressed, or order. <strong>No dragging is required.</strong> The Move up and Move down buttons work with a keyboard, mouse, or touch.</p>${p.steps.map((step,i)=>`<article class="proto-step" id="step-${esc(step.id)}"><div class="row between"><span class="count">Step ${i+1} of ${p.steps.length}</span><div class="row"><button class="btn quiet sm" type="button" data-act="move-step" data-id="${esc(step.id)}" data-dir="up" ${i===0?'disabled':''} aria-label="Move step ${i+1} up">↑ Move up</button><button class="btn quiet sm" type="button" data-act="move-step" data-id="${esc(step.id)}" data-dir="down" ${i===p.steps.length-1?'disabled':''} aria-label="Move step ${i+1} down">↓ Move down</button><button class="btn danger sm" type="button" data-act="delete-step" data-id="${esc(step.id)}" aria-label="Remove step ${i+1}" ${p.steps.length<=1?'disabled':''}>Remove</button></div></div><div class="fields"><div class="field"><label for="title-${esc(step.id)}">Step ${i+1} title</label><input id="title-${esc(step.id)}" type="text" data-step-input="${esc(step.id)}" data-step-key="title" maxlength="110" value="${esc(step.title)}"></div><div class="field"><label for="need-${esc(step.id)}">Need this step aims to address</label><select id="need-${esc(step.id)}" data-step-input="${esc(step.id)}" data-step-key="need"><option value="">Not yet assigned</option>${c.signals.map(sig=>`<option value="${sig.id}" ${step.need===sig.id?'selected':''}>${esc(sig.label)}</option>`).join('')}</select></div></div><div class="field"><label for="detail-${esc(step.id)}">What does ${esc(c.persona)} see, do, or receive?</label><textarea id="detail-${esc(step.id)}" data-step-input="${esc(step.id)}" data-step-key="detail" rows="2">${esc(step.detail)}</textarea><small>Describe a tangible message, sign, choice, or confirmation—not only the name of a feature.</small></div></article>` function prototypeChecks(){const p=state.prototype;const needs=new Set(p.steps.filter(x=>wc(x.detail)>=4).map(x=>x.need));return [{ok:wc(p.goal)>=7,msg:'State what the prototype should demonstrate (at least 7 words).'}, {ok:wc(p.testQuestion)>=7,msg:'Write an observable test question (at least 7 words).'}, {ok:p.steps.length>=3,msg:`Include at least three journey touchpoints. Current: ${p.steps.length}.`},{ok:p.steps.every(x=>wc(x.title)>=2&&wc(x.detail)>=5),msg:'Give every step a meaningful title and a concrete description.'},{ok:[...needs].filter(Boolean).length>=2,msg:'Address at least two distinct user needs from the interview.'}]}
function computeTest(){const c=C(),p=state.prototype,method=state.testing.method;const covered=c.signals.filter(x=>p.steps.some(step=>step.need===x.id&&wc(step.detail)>=4));const missing=c.signals.filter(x=>!covered.includes(x));const signature=protoSignature();const first=state.testing.runs[0];const hasChanged=!!first&&first.signature!==signature;

function renderTest(){const t=state.testing,c=C(),p=state.prototype,latest=t.runs.at(-1),first=t.runs[0],gaps=latest?.missing||[],methods=[['observe','Observe a task','Give the person a goal, and watch where they hesitate without guiding them.'],['leading','Explain while they try','Describe your intended steps as they use the design. This may conceal problems.'],['opinion','Ask if they like it','Collect a reaction, but do not observe task completion.']];return `<section class="section first">${heading(1,'Plan a user-centered test')}<p><strong>User task:</strong> ${esc(c.testTask)}</p><p><strong>Prototype test question:</strong> ${esc(p.testQuestion||'Not yet written. Visit Rapid Prototyping to define it.')}</p><div class="mode-note"><strong>A key limitation</strong><p>This lab produces <em>simulated</em> reactions based on the needs your prototype says it addresses. It does not replace testing with a real person. Each run is a learning exercise.</p></div><fieldset style="border:0;margin:0;padding:0"><legend class="label">Choose a testing approach</legend><div class="option-list">${methods.map(m=>`<label class="option"><input type="radio" name="test-method" data-radio="testing.method" value="${m[0]}" ${t.method===m[0]?'checked':''}><span><strong>${esc(m[1])}</strong><span class="small">${esc(m[2])}</span></span></label>`).join('')}</div></fieldset><div class="row"><button class="btn primary" type="button" data-act="run-test" ${!t.method?'disabled':''}>Run simulated user test</button><button class="btn outline" type="button" data-act="stage" data-stage="4">Edit the prototype</button></div><p class="small">${t.runs.length} simulation round${t.runs.length===1?'':'s'} saved. To compare iterations, change a touchpoint after your first round, then run another test.</p></section>
<section class="section">${heading(2,'Observe and interpret the result')}${latest?`<div class="grid two"><div class="testing-metric"><span class="small">Needs addressed in prototype</span><strong>${latest.coverage} / ${latest.total}</strong><span class="small">This is a <em>design coverage</em> count, not a user success rate.</span></div><div class="testing-metric"><span class="small">Method used</span><strong style="font-size:1.1rem">${esc(methods.find(x=>x[0]===latest.method)?.[1]||'')}</strong><span class="small">Round ${t.runs.length} · ${esc(latest.created)}</span></div></div><div class="feedback"><h3>Simulated observation from ${esc(c.persona)}</h3><blockquote style="margin:6px 0 13px;font-family:Georgia,serif;font-size:1.1rem">“${esc(latest.reaction)}”</blockquote><p>${esc(latest.note)}</p>${gaps.length?`<p><strong>Needs not yet represented by the prototype:</strong> ${gaps.map(id=>esc(c.signals.find(x=>x.id===id)?.label)).join('; ')}.</p>`:`<p><strong>All four documented needs are represented.</strong> This still does not demonstrate usability; a real task test may reveal new problems.</p>`}</div><p><strong>Unexpected wrinkle:</strong> ${esc(c.nudge)}</p><fieldset style="border:0;margin:0;padding:0"><legend class="label">What is the strongest next response?</legend><div class="option-list"><label class="option"><input type="radio" name="test-response" data-radio="testing.response" value="neutral" ${t.response==='neutral'?'checked':''}><span><strong>Ask a neutral follow-up and observe again.</strong><span class="small">Learn what the person expected to happen next.</span></span></label><label class="option"><input type="radio" name="test-response" data-radio="testing.response" value="defend" ${t.response==='defend'?'checked':''}><span><strong>Explain why the design should have worked.</strong><span class="small">Give the participant the intended answer.</span></span></label><label class="option"><input type="radio" name="test-response" data-radio="testing.response" value="guess" ${t.response==='guess'?'checked':''}><span><strong>Immediately redesign everything based on one comment.</strong><span class="small">Change the concept before clarifying what failed.</span></span></label></div></fieldset>${t.response?`<div class="feedback"><strong>Coach feedback</strong><p>${esc(t.response==='neutral'?'This best protects the quality of the observation. Ask what the person expected, then make a focused revision.':t.response==='defend'?'Explaining may help someone complete the task, but it obscures whether the prototype communicates clearly on its own.':'A comment is evidence to investigate, not automatically a reason for a wholesale redesign. Clarify the behavior and issue first.')}</p></div>`:''}${field('testing.interpretation','What did this observation suggest?',t.interpretation,{help:'Distinguish what the participant did or said from your explanation of why.'})}`:`<div class="subtle">Run the simulation above to see the first observation and interpretation choices.</div>`}</section>
<section class="section">${heading(3,'Revise, retest, and reflect')}<div class="row"><button class="btn outline" type="button" data-act="stage" data-stage="4">Return to prototype builder</button><button class="btn quiet" type="button" data-act="run-test" ${!t.method?'disabled':''}>Run another round</button></div>${first&&t.runs.length>=2?`<div class="subtle"><strong>Comparison of first and latest rounds</strong><p>Round 1: ${first.coverage} of ${first.total} documented needs represented.<br>Round ${t.runs.length}: ${latest.coverage} of ${latest.total} represented.</p><p>${first.signature===latest.signature?'No change to the prototype sequence was detected. Revise a step and retest to make this a genuine iteration.':'The prototype changed between rounds. Compare the gaps and look for new tradeoffs.'}</p></div>`:''}${field('testing.revisions','Which concrete prototype change did you make, and why?',t.revisions,{help:'Describe what changed between rounds and which observation prompted it.'})}${field('testing.reflection','What would you test with a real person next?',t.reflection,{help:'Include at least one uncertainty the simulation cannot resolve.'})}</section>`}
function testChecks(){const t=state.testing;return [{ok:t.runs.length>=1,msg:'Run at least one simulated user test.'},{ok:t.response==='neutral',msg:'Practice a neutral follow-up rather than defending or immediately overhauling the design.'},{ok:wc(t.interpretation)>=10,msg:'Interpret the observation in your own words (at least 10 words).'}, {ok:t.runs.length>=2&&t.runs[0].signature!==t.runs.at(-1).signature,msg:'Change the prototype and conduct a second, different round.'},{ok:wc(t.revisions)>=8&&wc(t.reflection)>=10,msg:'Document the revision and what must be tested with a real person next.'}]}
function checksForStage(){return [frameChecks,ideateChecks,selectionChecks,prototypeChecks,testChecks][state.stage-1]()}
function showReview(){if(state.stage===1){state.interview.showFeedback=true;state.interview.reviewed=true}if(state.stage===3)state.selection.reviewed=true;if(state.stage===4)state.prototype.reviewed=true;save();render('[data-act="review"]');const box=app.querySelector('#review-feedback');const checks=checksForStage();box.innerHTML=`<div class="feedback" tabindex="-1"><h3>Learning coach: review of this lab</h3>${feedbackList(checks).join('')}<p class="small">These prompts guide improvement. They are not an official course grade.</p></div>`;const focus=box.querySelector('.feedback');focus?.focus();focus?.scrollIntoView({block:'nearest'});announce('Review complete. '+checks.filter(x=>x.ok).length+' of '+checks.length+' checkpoints addressed.')}
function stageReady(){const s=state;switch(s.stage){case 1:{const x=s.interview;return activeNotes().filter(n=>x.classification[n.id]).length>=4&&x.support.length>=2&&x.counter.length>=1&&!!x.frame&&wc(x.povNeed)>=5&&wc(x.povInsight)>=7&&/^\s*how might we\b/i.test(x.hmw)&&/^\s*how might we\b/i.test(x.revision)&&wc(x.revisionReason)>=8}case 2:return ideateChecks().every(x=>x.ok);case 3:return selectionChecks().every(x=>x.ok);case 4:return prototypeChecks().every(x=>x.ok);case 5:return testChecks().filter((x,i)=>i!==1).every(x=>x.ok);default:return false}}
function goStage(n){if(!state)return;state.stage=STANDALONE_STAGE;save();render();announce('Opened '+STAGES[STANDALONE_STAGE-1].title)}

function printableArtifact(){const c=C(),i=state.interview,a=state.ideation,s=state.selection,p=state.prototype,t=state.testing,chosen=itemById(s.choice),latest=t.runs.at(-1);const findNote=id=>activeNotes().find(x=>x.id===id);let body=`<header><p class="meta">Design thinking · Learning artifact · Fictional case</p><h1>${esc(c.title)}</h1><p>${esc(c.persona)} — exported ${esc(new Date().toLocaleDateString())}</p></header>`;

function plainArtifact(){const c=C(),x=state;return [`DESIGN THINKING LEARNING ARTIFACT — ${c.title}`,`Persona: ${c.persona}`,'',`Problem framing: ${x.interview.hmw}`,`Revised framing: ${x.interview.revision}`,`Why the frame changed: ${x.interview.revisionReason}`,'','Ideas:',...x.ideation.ideas.map((a,i)=>`${i+1}. ${a.text} (${a.technique})`),'',`Selected concept: ${itemById(x.selection.choice)?.text||'Not selected'}`,`Decision rationale: ${x.selection.rationale}`,`Assumption to test: ${x.selection.assumption}`,`Tradeoff: ${x.selection.tradeoff}`,'','Prototype:',...x.prototype.steps.map((st,i)=>`${i+1}. ${st.title}: ${st.detail}`),'',`Simulated tests: ${x.testing.runs.length}`,`Observation: ${x.testing.interpretation}`,`Revision: ${x.testing.revisions}`,`Real-world next test: ${x.testing.reflection}`].join('\n')}
function extractLines(raw){let text=raw.trim();if(!text)return[];let lines=text.split(/\n+/).map(v=>v.replace(/^[-•*\d.)\s]+/,'').trim()).filter(v=>v.length>=18&&v.length<=500&&!/^(step \d|question \d|date:|name:|reflection:|the moderator|field notes|interview simulator|student field notes|interviewer:)$/i.test(v));if(lines.length===1&&lines[0].length>140)lines=lines[0].split(/(?<=[.!?])\s+(?=[A-Z])/).filter(x=>x.length>=18);return [...new Set(lines)].slice(0,10).map(t=>t.slice(0,320))}

function importInterviewFile(file){if(!file)return;if(file.size>1024*1024){announce('Choose a file under 1 MB.');return}const r=new FileReader();r.onload=()=>{try{let raw=String(r.result||'');if(/\.json$/i.test(file.name)){const parsed=JSON.parse(raw);if(parsed?.format==='DTL_INTERVIEW_V1'){if(parsed.caseId!==state.caseId){announce('That interview belongs to the other scenario. Select the matching scenario before importing.');return}const notes=Array.isArray(parsed.notes)?parsed.notes:[];let count=0;const current=new Set(state.interview.customNotes.map(x=>x.text));for(const note of notes){const text=String(typeof note==='string'?note:note?.text||'').trim().slice(0,450);if(text.length<15||current.has(text)||state.interview.customNotes.length>=20)continue;state.interview.customNotes.push({id:'U'+uid(),text,source:'Interview Simulator · '+CASES[state.caseId].persona,kind:null});current.add(text);count++}save();render();announce(`${count} interview findings imported. Classify each finding and check the sample evidence before framing.`);return}}if(/\.html?$/i.test(file.name)){const d=new DOMParser().parseFromString(raw,'text/html');for(const s of d.querySelectorAll('script,style,nav,header,footer'))s.remove();raw=[...d.body.querySelectorAll('p,li,blockquote')].map(el=>el.textContent.trim()).filter(Boolean).join('\n')||d.body.textContent||''}else if(/\.json$/i.test(file.name)){const v=JSON.parse(raw),out=[];const gather=(node,key='',depth=0)=>{if(out.length>=40||depth>8||node==null)return;if(typeof node==='string'){if(/note|quote|answer|response|observation|finding|comment|field/i.test(key)&&node.trim().length>=15)out.push(node.trim());return}if(Array.isArray(node)){node.slice(0,50).forEach(v=>gather(v,key,depth+1));return}if(typeof node==='object')Object.entries(node).slice(0,80).forEach(([k,v])=>gather(v,k,depth+1))};gather(v);raw=out.join('\n')||JSON.stringify(v,null,2)}state.interview.raw=clean(raw);addExtracted();announce('Interview file read. Review the extracted candidate findings.')}catch(e){announce('Could not read the interview report. Try pasting plain-text notes.')}};r.readAsText(file)}
function importProgressFile(file){if(!file)return;if(file.size>1024*1024){announce('Progress file exceeds 1 MB.');return}const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(String(r.result||''));if(!x||x.version!==1||!CASES[x.caseId]||!x.interview||!x.ideation||!x.selection||!x.prototype||!x.testing||!Array.isArray(x.prototype.steps)||!Array.isArray(x.ideation.ideas)||!Array.isArray(x.interview.customNotes)||!Array.isArray(x.testing.runs))throw Error('Format mismatch');if(x.caseId!==state.caseId){announce('This file is for the '+CASES[x.caseId].title+' case. Change scenario before importing it.');return}if(!confirm('Import this progress file for '+CASES[x.caseId].title+'? It will replace the current local work for this case.'))return;state=x;state.stage=STANDALONE_STAGE;save();render();announce('Progress imported. Continue in '+STAGES[STANDALONE_STAGE-1].title)}catch(e){announce('Import failed. Choose a progress JSON file exported from one of these learning labs.')}};r.readAsText(file)}
function setStageFromHash(){}
app.addEventListener('click',e=>{const el=e.target.closest('button[data-act]');if(!el||el.disabled)return;const act=el.dataset.act,id=el.dataset.id,n=Number(el.dataset.stage);switch(act){
case 'start':state=loadState(el.dataset.case);goStage(STANDALONE_STAGE);break;
case 'reset-case':if(confirm('Start this scenario over? Saved work on this device for this scenario will be replaced.')){try{localStorage.removeItem(stateKey(el.dataset.case))}catch(e){}renderHome(true);announce('Scenario reset.')}break;
case 'home':state=null;history.replaceState(null,'',location.pathname+location.search);renderHome(true);announce('Choose a scenario.');break;
case 'stage':announce('This simulation is a separate course activity. Download your progress and open the appropriate lab HTML file.');break;
case 'review':showReview();break;
case 'complete':completeStage();break;
case 'audit-feedback':state.interview.showFeedback=true;persistAndRender('[data-act="audit-feedback"]');announce('Evidence classification feedback is now visible on the cards.');break;
case 'classify':state.interview.classification[el.dataset.note]=el.dataset.kind;persistAndRender(`[data-act="classify"][data-note="${el.dataset.note}"][data-kind="${el.dataset.kind}"]`);announce(`Note ${el.dataset.note} classified as ${el.dataset.kind}.`);break;
case 'evidence-role':{const i=state.interview,note=el.dataset.note,role=el.dataset.role,other=role==='support'?'counter':'support';if(i[role].includes(note))i[role]=i[role].filter(x=>x!==note);else{if(i[role].length>=5){announce('You may choose up to five notes per evidence group.');return}i[role].push(note);i[other]=i[other].filter(x=>x!==note)}persistAndRender(`[data-act="evidence-role"][data-role="${role}"][data-note="${note}"]`);announce(`Evidence trail updated: ${i.support.length} supporting, ${i.counter.length} complicating.`);break;}
case 'delete-note':state.interview.customNotes=state.interview.customNotes.filter(x=>x.id!==el.dataset.note);state.interview.support=state.interview.support.filter(x=>x!==el.dataset.note);state.interview.counter=state.interview.counter.filter(x=>x!==el.dataset.note);persistAndRender('#audit');announce('Student-added research note removed.');break;
case 'add-note':{const text=state.interview.draftNote.trim();if(text.length<15){announce('Write at least 15 characters describing a research finding before adding it.');app.querySelector('#new-note')?.focus();return}if(state.interview.customNotes.length>=20){announce('Maximum 20 student-added notes per scenario.');return}state.interview.customNotes.push({id:'U'+uid(),text:text.slice(0,450),source:'My interview',kind:null});state.interview.draftNote='';persistAndRender('#new-note');announce('Interview finding added as a research card.');break;}
case 'extract-notes':addExtracted();break;
case 'technique':state.ideation.technique=el.dataset.technique;persistAndRender(`[data-technique="${el.dataset.technique}"]`);announce('Creative thinking technique changed.');break;
case 'add-idea':{const a=state.ideation,txt=a.draftIdea.trim();if(txt.length<15){announce('Describe the idea with at least 15 characters.');app.querySelector('#idea-draft')?.focus();return}if(a.ideas.length>=15){announce('Idea bank is limited to 15 ideas. Compare or remove an existing idea first.');return}a.ideas.push({id:uid(),text:txt.slice(0,600),technique:a.technique});a.draftIdea='';persistAndRender('#idea-draft');announce('Idea '+a.ideas.length+' added to your idea bank.');break;}
case 'delete-idea':state.ideation.ideas=state.ideation.ideas.filter(x=>x.id!==id);state.selection.candidates=state.selection.candidates.filter(x=>x!==id);delete state.selection.ratings[id];if(state.selection.choice===id)state.selection.choice='';persistAndRender('[data-act="add-idea"]');announce('Idea removed.');break;
case 'wildcard':state.ideation.wildcardIndex=(state.ideation.wildcardIndex+1)%C().wildcards.length;persistAndRender('[data-act="wildcard"]');announce('New constraint: '+C().wildcards[state.ideation.wildcardIndex]);break;
case 'add-step':if(state.prototype.steps.length>=8){announce('Maximum eight prototype steps. Simplify the journey before adding more.');return}state.prototype.steps.push({id:uid(),title:'New touchpoint',detail:'',need:''});state.prototype.reviewed=false;persistAndRender('[data-act="add-step"]');announce('New touchpoint added.');break;
case 'delete-step':if(state.prototype.steps.length<=1)return;state.prototype.steps=state.prototype.steps.filter(x=>x.id!==id);state.prototype.walk=Math.min(state.prototype.walk,state.prototype.steps.length-1);state.prototype.reviewed=false;persistAndRender('[data-act="add-step"]');announce('Touchpoint removed.');break;
case 'move-step':{const steps=state.prototype.steps,idx=steps.findIndex(x=>x.id===id);if(idx<0)return;const target=idx+(el.dataset.dir==='up'?-1:1);if(target<0||target>=steps.length)return;[steps[idx],steps[target]]=[steps[target],steps[idx]];state.prototype.walk=target;state.prototype.reviewed=false;persistAndRender(`[data-act="move-step"][data-id="${id}"][data-dir="${el.dataset.dir}"]`);announce('Touchpoint moved to position '+(target+1)+'.');break;}
case 'preview':state.prototype.preview=!state.prototype.preview;state.prototype.walk=0;persistAndRender('[data-act="preview"]');announce(state.prototype.preview?'Prototype walkthrough opened.':'Prototype walkthrough closed.');break;
case 'walk':{const p=state.prototype;p.walk=Math.max(0,Math.min(p.steps.length-1,p.walk+(el.dataset.dir==='forward'?1:-1)));persistAndRender(`[data-act="walk"][data-dir="${el.dataset.dir}"]`);announce('Prototype step '+(p.walk+1)+' of '+p.steps.length+': '+p.steps[p.walk].title);break;}
case 'check-proto':state.prototype.reviewed=true;persistAndRender('[data-act="check-proto"]');announce('Prototype coverage review displayed.');break;
case 'run-test':{const t=state.testing;if(!t.method){announce('Choose a testing approach.');return}const sig=protoSignature();if(t.runs.length>=10){announce('Maximum of 10 simulation rounds per scenario. You can export the artifact now.');return}t.runs.push(computeTest());persistAndRender('[data-act="run-test"]');announce('Simulated test round '+t.runs.length+' finished. '+t.runs.at(-1).coverage+' of '+t.runs.at(-1).total+' documented needs represented.');break;}
case 'export-json':fileDownload(`Lab_04_$Idea_selection_${state.caseId}_progress.json`,JSON.stringify(state,null,2),'application/json;charset=utf-8');announce('Progress JSON downloaded.');break;
case 'import-progress':app.querySelector('#progress-file')?.click();break;
case 'export-artifact':fileDownload(`design_thinking_${state.caseId}_learning_artifact.html`,printableArtifact(),'text/html;charset=utf-8');announce('Learning artifact downloaded. Open it in a browser to print or save as PDF.');break;
}});
app.addEventListener('input',e=>{const f=e.target.dataset.field;if(f){setPath(f,e.target.value);return}const noteId=e.target.dataset.editNote;if(noteId){const note=state.interview.customNotes.find(x=>x.id===noteId);if(note){note.text=e.target.value.slice(0,450);save()}return}const stepId=e.target.dataset.stepInput,key=e.target.dataset.stepKey;if(stepId&&key){const step=state.prototype.steps.find(x=>x.id===stepId);if(step){step[key]=e.target.value;state.prototype.reviewed=false;save()}}});
app.addEventListener('change',e=>{const el=e.target;if(el.id==='interview-file'){importInterviewFile(el.files[0]);return}if(el.id==='progress-file'){importProgressFile(el.files[0]);return}if(el.dataset.radio){setPath(el.dataset.radio,el.value);const f=el.dataset.radio;if(f==='selection.choice')state.selection.reviewed=false;save();render(`input[data-radio="${f}"][value="${el.value}"]`);announce('Choice updated.');return}if(el.dataset.candidate){const s=state.selection,id=el.dataset.candidate;if(el.checked){if(s.candidates.length>=3){el.checked=false;announce('Choose at most three ideas for comparison.');return}s.candidates.push(id)}else{s.candidates=s.candidates.filter(x=>x!==id);if(s.choice===id)s.choice=''}s.reviewed=false;persistAndRender(`[data-candidate="${id}"]`);announce(s.candidates.length+' ideas chosen for comparison.');return}if(el.dataset.rating){const id=el.dataset.rating,key=el.dataset.criterion;state.selection.ratings[id]??={};state.selection.ratings[id][key]=Number(el.value)||0;state.selection.reviewed=false;persistAndRender(`[data-rating="${id}"][data-criterion="${key}"]`);announce('Rating saved.');return}if(el.dataset.stepInput){const step=state.prototype.steps.find(x=>x.id===el.dataset.stepInput);if(step){step[el.dataset.stepKey]=el.value;state.prototype.reviewed=false;save()}}});

renderHome();
})();</script>
